    if(typeof AndroidHost==='undefined'||typeof AndroidHost.ttsReady!=='function'||!AndroidHost.ttsReady()) return false;
    AndroidHost.speak('android-direct-'+Date.now()+'-'+(++ANDROID_DIRECT_TTS_SEQUENCE),String(text||''),lang||'en-US');
    return true;
  }catch(e){ return false; }
}
function speak(text,lang){                     // Native Android TTS, then browser Web Speech fallback
  if(androidDirectSpeak(text,lang)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate=0.95;
    const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase()));
    if(vs.length) u.voice=vs[0];
    speechSynthesis.speak(u);
  }catch(e){ toast('This browser has no speech support.'); }
}
function oxfordCandidates(word,accent){        // accent: 'uk' | 'us' — streamed from Oxford, nothing stored locally
  accent=ipaNorm(accent);
  const suf=accent==='uk'?'gb':'us';
  let w=word.toLowerCase()
    .replace(/\(.*?\)/g,' ')                   // "hone (a skill)" -> "hone"
    .replace(/^(?:to|a|an|the)\s+/,'')         // "a creative outlet" -> "creative outlet"
    .replace(/[’']/g,'_')
    .replace(/[^a-z_\- ]/g,'')
    .trim().replace(/[\s\-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
  if(!w) return [];
  const stems=[w];
  if(w.length>4&&/s$/.test(w)&&!/ss$/.test(w)) stems.push(w.replace(/s$/,''));
  const out=[];
  for(const s of stems){
    const dir='https://www.oxfordlearnersdictionaries.com/media/english/'+(accent==='uk'?'uk':'us')+'_pron/'
      +s[0]+'/'+(s+'___').slice(0,3)+'/'+(s+'_____').slice(0,5)+'/';
    out.push(dir+s+'__'+suf+'_1.mp3');         // plain entries:      pastime__gb_1.mp3
    out.push(dir+s+'_1_'+suf+'_1.mp3');        // numbered entries:   take_up_1_gb_1.mp3
  }
  return out;
}
function playWord(word,accent){
  accent=ipaNorm(accent||ipaDefault());

}
function playSentence(text, accent){

  accent=ipaNorm(accent||ipaDefault());
  const lang=accent==='uk'?'en-GB':'en-US';
  if(t.length<=190){                           // Google Translate TTS streams short sentences
    const q=encodeURIComponent(t);
    const tl=accent==='uk'?'en-GB':'en-US';
    playSeq([
      'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl='+encodeURIComponent(tl)+'&q='+q,
      'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+encodeURIComponent(tl)+'&q='+q

  } else speak(t,lang);
}

/* US IPA dictionary: CMU-derived shards (Oxford-US notation, same conventions as the Oxford audio

const ipaShards=new Map();
async function loadIpaShard(accent,letter){       // accent 'us' (CMU) | 'uk' (RP, ipa-dict)
  const key=accent+':'+letter;
  if(ipaShards.has(key)) return ipaShards.get(key);
  const sub=accent==='uk'?'uk/':'';
  let data=null;
  try{
    const r=await fetchWithTimeout('data/ipa/'+sub+letter+'.json',{cache:'force-cache'},8000);
    if(r.ok) data=await r.json();
  }catch(e){}
  ipaShards.set(key,data||{});
  return data||{};
}
async function shardIpaFor(word,accent){
  const w=String(word||'').toLowerCase().replace(/[^a-z'\-]/g,'');
  if(!w) return '';
  const shard=await loadIpaShard(accent,w[0]);
  const tries=[w];
  if(w.endsWith("'s")) tries.push(w.slice(0,-2));
  if(w.length>3&&w.endsWith('es')) tries.push(w.slice(0,-2));
  if(w.length>2&&w.endsWith('s')) tries.push(w.slice(0,-1));
  for(const t of tries){ if(shard[t]) return '/'+shard[t]+'/'; }

function wrapIpa(s){

  if(!validIpa(s)) return '';
  if(s.startsWith('/')) return s;
  const inner=s.replace(/^\/|\/$/g,'');

}
function validIpa(value){

  if(!s||/[….]/.test(s)||/^[-—/\\s]+$/.test(s)) return false;
  const inner=s.replace(/^\/|\/$/g,'').trim();
  // IPA output must contain a real pronunciation character, not only labels
  // or punctuation returned by an unavailable source.
  return /[a-zɑ-ʯə-ʸˈˌɐ-ʯ]/i.test(inner);

async function ipaForWord(word,accent,fallback){

  // overwritten by the older CMU/RP shards, whose transcription can differ
  // materially from Oxford (for example, voicing and syllable boundaries).

const datamuseIpaCache=new Map();

const ipaCache=new Map();
const wiktionaryIpaCache=new Map();
function learnerIpaNotation(value){return wrapIpa(String(value||'').replace(/ɹ/g,'r').replace(/\./g,''));}
async function wiktionaryIpaPair(word){
  const key=normWordKey(word);if(wiktionaryIpaCache.has(key))return wiktionaryIpaCache.get(key);
  const out={us:'',uk:''};

    const url='https://en.wiktionary.org/w/api.php?action=parse&page='+encodeURIComponent(key)+'&prop=wikitext&format=json&origin=*';
    const r=await fetchWithTimeout(url,{},6000);if(r.ok){

async function fetchIPA(word){

  // shards are offline fallbacks only; treating them as Oxford equivalents was
  // the cause of many visibly different transcriptions.

/* EN -> VI translation for the word popup. MyMemory is primary (CORS-enabled in real browsers),
   Google gtx as fallback. Results are cached in-memory AND in the meta store to save API quota. */
const viCache=new Map();
function decodeEntities(s){   // MyMemory returns HTML entities (&nbsp; &#39; &amp; …) inside translatedText
  if(!/[& ]/.test(s)) return s.replace(/\s+/g,' ').trim();
  const t=document.createElement('textarea');
  t.innerHTML=s;
  return t.value.replace(/ /g,' ').replace(/\s+/g,' ').trim();
}
const VI_TRANSLATE_QUERY_LIMIT=450;
function validViTranslation(s){
  return !!String(s||'').trim()&&!/^(?:MYMEMORY WARNING|QUERY LENGTH LIMIT EXCEEDED)/i.test(String(s||'').trim());
}
function viTranslationChunks(text,max=VI_TRANSLATE_QUERY_LIMIT){
  const input=String(text||'').replace(/\s+/g,' ').trim();
  if(!input||input.length<=max) return input?[input]:[];
  const sentences=input.match(/[^.!?]+(?:[.!?]+["'’”)]*|$)/g)||[input];
  const chunks=[];
  let current='';
  const addPiece=piece=>{
    piece=String(piece||'').trim();
    if(!piece) return;
    if(piece.length>max){
      let rest=piece;
      while(rest.length>max){
        let cut=rest.lastIndexOf(' ',max);
        if(cut<1) cut=max;
        chunks.push(rest.slice(0,cut).trim());
        rest=rest.slice(cut).trim();
      }
      if(rest) addPiece(rest);
      return;
    }
    const next=current?current+' '+piece:piece;
    if(next.length>max){ if(current) chunks.push(current); current=piece; }
    else current=next;
  };
  sentences.forEach(addPiece);
  if(current) chunks.push(current);
  return chunks;
}
async function translateVi(text){
  const raw=String(text||'').trim();
  const k=raw.toLowerCase();
  if(!k) return '';
  if(viCache.has(k)){
    const cached=viCache.get(k);
    if(validViTranslation(cached)) return cached;
    viCache.delete(k);
  }
  try{
    const c=await idbReq(db.transaction('meta').objectStore('meta').get('tr:'+k));
    if(c&&c.v){
      const v=decodeEntities(c.v);
      if(validViTranslation(v)){ viCache.set(k,v); return v; }   // decode old cached values too
    }
  }catch(e){}
  if(raw.length>VI_TRANSLATE_QUERY_LIMIT){
    const translated=[];
    for(const chunk of viTranslationChunks(raw)){
      const part=await translateVi(chunk);
      if(!part) return '';
      translated.push(part);
      // A cached long translation can otherwise form one uninterrupted microtask
      // chain. Yield so navigation and rating controls can process input.
      await new Promise(resolve=>setTimeout(resolve,0));
    }
    const out=translated.join(' ').trim();
    if(out){
      viCache.set(k,out);
      try{ await idbPut('meta',{k:'tr:'+k,v:out,updatedAt:new Date().toISOString()}); }catch(e){}
    }
    return out;
  }
  let out='';
  try{
    const r=await fetchWithTimeout('https://api.mymemory.translated.net/get?q='+encodeURIComponent(raw)+'&langpair=en|vi',{},7000);
    if(r.ok){
      const j=await r.json();
      out=String((j.responseData&&j.responseData.translatedText)||'').trim();
      if(!validViTranslation(out)) out='';
    }
  }catch(e){}
  if(!out){
    try{
      const r=await fetchWithTimeout('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q='+encodeURIComponent(raw),{},7000);
      if(r.ok){ const j=await r.json(); out=String((j[0]||[]).map(s=>(s&&s[0])||'').join('')).trim(); }
    }catch(e){}
  }
  out=decodeEntities(out);
  if(!validViTranslation(out)) out='';
  if(out) viCache.set(k,out);
  if(out){ try{ await idbPut('meta',{k:'tr:'+k,v:out,updatedAt:new Date().toISOString()}); }catch(e){} }
  return out;
}
/* Vietnamese is presentation-only enrichment. Keep it off the render/navigation
   critical path and start each request only when its future line nears the viewport. */
const VI_LAZY={waiting:[],active:0,max:2,jobs:new WeakMap(),observer:null};
function viLazyPump(){
  while(VI_LAZY.active<VI_LAZY.max&&VI_LAZY.waiting.length){
    const job=VI_LAZY.waiting.shift(),el=job&&job.el;
    if(!el||!el.isConnected||VI_LAZY.jobs.get(el)!==job) continue;
    VI_LAZY.active++;

        const value=await job.load();
        if(el.isConnected&&VI_LAZY.jobs.get(el)===job) job.apply(value);
      }catch(e){
        if(el.isConnected&&VI_LAZY.jobs.get(el)===job) job.apply(null);
      }finally{
        if(VI_LAZY.jobs.get(el)===job) VI_LAZY.jobs.delete(el);
        VI_LAZY.active--;

  if(ev.target.closest('#selpop')) return;
  const insideWordPop=ev.target.closest('#wordpop');
  if(!insideWordPop) $('#wordpop').style.display='none';
  if(!eligibleWordTarget(ev.target)) return;
  if(window.getSelection().toString()) return;          // user is selecting text
  if(lastPointerType==='touch'){                        // mobile: double-tap = primary, triple-tap = alternate
    const now=Date.now();
    if(now-tapState.t<TAP_GAP_MS&&Math.abs(ev.clientX-tapState.x)<48&&Math.abs(ev.clientY-tapState.y)<48) tapState.count++;
    else tapState.count=1;
    tapState.t=now; tapState.x=ev.clientX; tapState.y=ev.clientY;
    clearTimeout(tapState.timer);
    if(tapState.count>=3){ tapState.count=0; wordPopupAt(tapState.x,tapState.y,ipaAlt()); }
    else if(tapState.count===2){
      tapState.timer=setTimeout(()=>{ if(tapState.count===2){ tapState.count=0; wordPopupAt(tapState.x,tapState.y,ipaDefault()); } },TAP_RESOLVE_MS);
    }
  }else if(ev.detail===1){                              // desktop: single left-click = primary
    wordPopupAt(ev.clientX,ev.clientY,ipaDefault());
  }
});

  if(lastPointerType!=='mouse') return;

  if(selected){ev.preventDefault();showSelectionActions(ev.clientX,ev.clientY,selected);return;}

});

async function setCompletion(key,level){
  level=Math.max(0,Math.min(100,+level||0));
  // Keep a timestamped 0% tombstone so a later S3 merge cannot resurrect an
  // older completion value from another browser.
  const rec={key,completion:level,updatedAt:new Date().toISOString()};
  S.completions.set(key,rec); await idbPut('progress',rec);
  if((level===0||level===100)&&key.includes('|L3|')){
    const childPrefix=key.replace('|L3|','|L4|')+'|', childKeys=new Set();
    for(const childKey of S.completions.keys()) if(childKey.startsWith(childPrefix)) childKeys.add(childKey);
    document.querySelectorAll('[data-completion-key]').forEach(btn=>{ const child=decodeURIComponent(btn.dataset.completionKey||''); if(child.startsWith(childPrefix)) childKeys.add(child); });
    if(key.startsWith('completion|dol-listening|')){
      const man=await listenManifest();
      for(const test of man.tests||[]) if(dolListeningCompletionKey(3,test)===key) for(let i=1;i<=+(test.sectionCount||0);i++) childKeys.add(dolListeningCompletionKey(4,test,i));
    }else if(key.startsWith('completion|dol-reading|')){
      const man=await dolReadingManifest();
      for(const test of man.tests||[]) if(dolReadingCompletionKey(3,test)===key) for(let i=1;i<=+(test.passageCount||0);i++) childKeys.add(dolReadingCompletionKey(4,test,'Passage '+i));
    }else if(key.startsWith('completion|dol-vocab|')){
      const pages=await dolDisplayStubPages(), page=pages.find(x=>dolVocabCompletionKey(3,x)===key);
      if(page){ let lesson=lessonById(page.id); if(!lesson||!lesson.sections?.length){ await dolLoadLessonDetail(page.id); lesson=lessonById(page.id); }
        for(const section of lesson?.sections||[]) if(!/^(sources?|nguồn)$/i.test(String(section.title||'').trim())) childKeys.add(dolVocabCompletionKey(4,lesson,section.title||section.id)); }
    }
    for(const childKey of childKeys){ const childRec={key:childKey,completion:level,updatedAt:rec.updatedAt}; S.completions.set(childKey,childRec); await idbPut('progress',childRec); }
  }
  document.querySelectorAll('[data-completion-key]').forEach(btn=>{
    const buttonKey=decodeURIComponent(btn.dataset.completionKey||'');
    const affected=buttonKey===key||((level===0||level===100)&&key.includes('|L3|')&&buttonKey.startsWith(key.replace('|L3|','|L4|')+'|'));
    if(affected) btn.classList.toggle('done',+btn.dataset.completionLevel===completionValue(buttonKey));
  });
  toast('Completion '+level+'% ✓');
  renderHero();
  const parts=(location.hash||'#/dashboard').slice(2).split('/');
  if(parts[0]==='listening'&&!parts[1]&&LSF.conf)renderListening();
  else if(parts[0]==='dol-reading'&&!parts[1]&&DRF.conf)renderDolReading();
  else if(parts[0]==='dol'&&!parts[1]&&DDF.conf)renderDolDetails();
}

async function setItemConf(store,id,level,opts){
  opts=opts||{};
  const preserveSound=audioIsPlaying();
  const map=store==='words'?S.words:S.sentences;
  let rec=map.get(id);
  // Detail cards seed their word metadata during progressive hydration. Use
  // that O(1) record before attempting any catalog lookup: lessonVocabById()
  // cold-parses every lesson and made the first confidence click block for
  // tens of seconds on large libraries.
  let seed=ITEM_CONF_SEEDS.get(id);
  let v=null;
  if(store==='words'&&!seed&&!opts.skipSourceLookup){
    v=lessonVocabById(id)||dolVocabById(id);
    seed=v||null;
  }
  if(store==='words'){
    const text=(rec&&(rec.text||rec.en))||(seed&&(seed.text||seed.en))||'';
    const canonicalId=canonicalWordReviewId(text);
    if(canonicalId){
      rec=map.get(canonicalId)||(opts.skipSourceLookup?newestMatchingReview(map,text,'word',canonicalId):savedWordForLessonText('',text,canonicalId));
      id=canonicalId;
      if(seed) ITEM_CONF_SEEDS.set(id,Object.assign({},seed,{id}));
    }
  }
  if(!rec){
    if(seed){
      const now=new Date().toISOString();
      rec=store==='words'
        ?{id,lessonId:seed.lessonId||'dictionary',text:seed.text||seed.en||'',vn:seed.vn||'',ipa:seed.ipa||'',confidence:0,addedAt:now}
        :{id,lessonId:seed.lessonId||'dictionary',sectionId:seed.sectionId||'',en:seed.en||seed.text||'',vn:seed.vn||'',confidence:0,addedAt:now};
      map.set(id,rec);
    }
  }
  if(!rec) return;
  // A word may already exist under its canonical id from Dictionary or an old
  // import. When it is rated from a real lesson/detail page, keep that concrete
  // origin so Words and Cards can link back to the page that supplied it.
  if(store==='words'&&seed&&seed.lessonId&&seed.lessonId!=='dictionary'){
    rec.lessonId=seed.lessonId;
    for(const field of ['sectionId','group','book','skill','testNum','passageNum','l1','l2','l3','l4'])if(seed[field]!=null&&seed[field]!=='')rec[field]=seed[field];
  }
  const nextConfidence=rec.confidence===level?0:level;
  if(store==='words'&&nextConfidence===0){
    await removeGlobalReviewMatches('words',rec);
    ITEM_CONF_SEEDS.delete(id);
    DOL_VOCAB_CACHE=null;
    if(document.getElementById('dolDetailFilterStatus')) applyDolLessonConfidenceFilter();
    if(!opts.silent&&!opts.preserveView&&!READER_DOCK.active) route();
    if(!opts.silent) renderHero();
    return;
  }
  rec.confidence=nextConfidence;
  rec.confidenceUpdatedAt=new Date().toISOString();
  rec.updatedAt=rec.confidenceUpdatedAt;
  await idbPut(store,rec);
  if(store==='words'&&!opts.skipDolSync){
    const sync=syncDolWordConfidence(rec);
    if(opts.deferDolSync) sync.catch(e=>console.warn('sync word confidence',e));
    else await sync;
  }
  else await syncSentenceConfidence(rec);
  if(!opts.silent&&store==='words'&&document.getElementById('dolDetailFilterStatus')) applyDolLessonConfidenceFilter();
  if(store==='words'){
    DOL_VOCAB_CACHE=null;
    const indexed=(opts.skipDolSync||opts.deferDolSync)?null:DOL_INDEX.items.find(x=>x.id===id);
    if(indexed){
      indexed.confidence=rec.confidence||0;
      indexed.flagged=true;
      indexed.addedAt=rec.addedAt||indexed.addedAt;
      if(rec.vn) indexed.vn=rec.vn;
      if(rec.ipa) indexed.ipa=rec.ipa;
      if(rec.exEn){indexed.exEn=rec.exEn;indexed.exVi=rec.exVi||'';}
    }
  }
  // The clicked lesson control has already updated itself in place. Rebuilding
  // the whole lesson here changes card heights while IPA/translation requests
  // restart, which makes the viewport jump away from the word being rated.
  const inLessonView=!!document.querySelector('#view .lesson-content');
  if(!opts.silent&&!opts.preserveView&&!READER_DOCK.active&&!preserveSound&&!audioIsPlaying()&&!inLessonView) route();
  if(!opts.silent)renderHero();
}

async function removeGlobalReviewMatches(store,rec){
  if(!rec) return;
  const map=store==='words'?S.words:S.sentences;
  const norm=store==='words'?normWordKey:normSentenceKey;
  const key=norm(store==='words'?(rec.text||rec.en):(rec.en||rec.text));
  const family=store==='words'?new Set(enExampleTargets(key).map(normWordKey)):null;
  const ids=[...map.values()]
    .filter(other=>{
      const otherKey=norm(store==='words'?(other.text||other.en):(other.en||other.text));
      return otherKey===key||(store==='words'&&(family.has(otherKey)||enExampleTargets(otherKey).some(form=>normWordKey(form)===key)));
    })
    .map(other=>other.id);
  for(const id of ids){ map.delete(id); ITEM_CONF_SEEDS.delete(id); await idbDel(store,id); }
  if(store==='words'){
    for(let i=0;i<DOL_INDEX.items.length;i++){
      const item=DOL_INDEX.items[i];
      if(family.has(normWordKey(item.text))){item.confidence=0;item.flagged=false;}
      if(i&&i%750===0) await new Promise(resolve=>setTimeout(resolve,0));
    }
    document.querySelectorAll('#view .dol-word-card,#view [data-vblock]').forEach(card=>{
      const wordEl=card.querySelector('.w,.head,.word,.hw,.vocab-word');if(!wordEl)return;
      const clone=wordEl.cloneNode(true);clone.querySelectorAll('.ipa,.ipat,.pron,button').forEach(x=>x.remove());
      if(!family.has(normWordKey(clone.textContent)))return;
      card.querySelectorAll('.confbtns button').forEach(button=>button.className='');
    });
    DOL_VOCAB_CACHE=null;
  }
}

function lessonMatches(l,pct,mode=LIST_MODE){
  const F=lessonFilterForMode(mode);
  if(F.topic&&String(l.topicNumber)!==F.topic) return false;
  if(F.src&&(l.source||'claude-cowork')!==F.src) return false;
  if(F.type&&(l.type||'lesson')!==F.type) return false;
  const dt=(isBbcLike(l)?bbcEpisodeDate(l):(l.dateTime||'').slice(0,10));
  if(F.from&&dt<F.from) return false;
  if(F.to&&dt>F.to) return false;
  if(F.conf&&!passCompletionFilter(pct,F.conf)) return false;
  if(mode==='dol'&&isDolLike(l)){
    const ui=dolUiMeta(l);
    if(F.l1&&ui.l1!==F.l1) return false;
    if(F.l2&&ui.l2!==F.l2) return false;
    if(F.l3&&ui.l3!==F.l3) return false;
    if(F.skill&&(l.skill||'').toLowerCase()!==F.skill) return false;
  }
  if(F.q){ const q=F.q.toLowerCase();
    const hay=(l.title+' '+(l.titleVi||'')+' '+(l.angle||'')+' '+(l.category||'')+' '+(l.type||'')+' '+(l.group||'')+' '+(l.book||'')+' '+(l.skill||'')+' '+(l.words||[]).join(' ')).toLowerCase();
    if(!hay.includes(q)) return false; }
  return true;
}

function summaryLines(sum,lang){
  if(!sum||typeof sum!=='object') return [];
  const v=sum[lang];
  if(Array.isArray(v)) return v.filter(Boolean).map(String);
  if(v) return [String(v)];
  return [];
}
function summaryBlockHTML(sum){
  const ens=summaryLines(sum,'en'), vis=summaryLines(sum,'vi');
  if(!ens.length&&!vis.length) return '';
  const pairs=[];
  for(let i=0;i<Math.max(ens.length,vis.length);i++){
    if(ens[i]) pairs.push('<p class="en">'+esc(ens[i])+'</p>');
    if(vis[i]) pairs.push('<p class="vi">'+esc(vis[i])+'</p>');
  }
  return pairs.join('');
}
function othersSummaryPresent(l){
  return !!summaryBlockHTML(l.summary);

function linksFromHtml(html){
  const out=[];
  if(!html) return out;
  const re=/<a\s+[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;
  let m;
  while((m=re.exec(html))){
    const url=m[1].trim();
    if(!/^https?:\/\//i.test(url)) continue;
    const name=m[2].replace(/<[^>]+>/g,'').trim()||url;
    out.push({url,name});
  }
  return out;
}
function dedupeSourceLinks(list){
  const seen=new Map();
  list.forEach(s=>{
    if(!s||!s.url) return;
    const key=s.url.replace(/#.*$/,'').replace(/\/+$/,'').toLowerCase();
    if(!seen.has(key)) seen.set(key,{url:s.url,name:s.name||s.url});
  });
  return [...seen.values()];
}
function collectOtherSources(l){
  const out=[];
  (l.sourceNotes||[]).forEach(n=>{
    if(n&&n.url) out.push({url:n.url,name:n.name||n.url});
  });
  (l.sources||[]).forEach(s=>{
    if(typeof s==='string'){
      const urlM=s.match(/https?:\/\/[^\s"']+/);
      if(urlM) out.push({url:urlM[0],name:s.replace(urlM[0],'').replace(/[—–-]\s*$/,'').trim()||urlM[0]});
      return;
    }
    if(s&&s.url) out.push({url:s.url,name:s.name||s.description||s.url});
  });
  (l.sections||[]).forEach(sec=>{ out.push(...linksFromHtml(sec.html)); });
  return dedupeSourceLinks(out);
}
function otherSourceLabel(source){
  const name=String(source.name||source.url||'').trim();
  if(name&&name!==source.url) return name;
  try{
    const u=new URL(source.url,location.href), host=u.hostname.replace(/^www\./i,'');
    const path=u.pathname.split('/').filter(Boolean);
    if(host.toLowerCase()==='github.com'&&path.length>=2) return host+'/'+path.slice(0,2).join('/');
    const withPath=host+(path.length?'/'+path.join('/'):'');
    if(path.length&&withPath.length<=52) return withPath;
    return host||name;
  }catch(e){ return name; }
}

    scheduleDolExampleRefresh();
    done();
  };
  const step=()=>{
    if(token!==LESSON_DECORATE_TOKEN||location.hash!=='#/lesson/'+encodeURIComponent(l.id)){
      if(observer) observer.disconnect();

    }
    const frameStart=performance.now();
    while(index<blocks.length&&performance.now()-frameStart<7){
      const block=blocks[index++];

function decorateDolExamples(root,schedule=true){
  const selector='.lesson-content.dol .vocab, .lesson-content.dol .dol-card';
  const blocks=[...(root.matches?.('.vocab,.dol-card')?[root]:[]),...root.querySelectorAll(selector)];
  blocks.forEach(block=>{
    if(block.querySelector('.dol-ex')) return;
    const exEl=block.querySelector('.en.ex, p.en.ex');
    if(!exEl) return;
    const exEn=exEl.textContent.replace(/\s+/g,' ').trim();
    if(!exEn) return;
    const exViEl=viSiblingOf(exEl);
    const exVi=exViEl?exViEl.textContent.replace(/\s+/g,' ').trim():'';
    const head=block.querySelector('.head,.word,.hw');
    let word='';
    if(head){
      const clone=head.cloneNode(true);
      clone.querySelectorAll('.ipa,.pron,.soundbtn').forEach(x=>x.remove());
      word=clone.textContent.replace(/\s+/g,' ').trim().replace(/^\d+\s*[.)·]\s*/,'');
    }
    const wrap=document.createElement('div');
    wrap.innerHTML=dolExampleBlockHTML({id:'dol-lesson-'+hashStr(exEn), text:word, exEn, exVi});
    if(wrap.firstElementChild){ exEl.replaceWith(wrap.firstElementChild); if(exViEl) exViEl.remove(); }
  });
  if(schedule) scheduleDolExampleRefresh();
}

async function dolEnsureBookIndex(bookKey){
  if(DOL_INDEX.loadedBooks.has(bookKey)) return DOL_INDEX.items;
  if(DOL_INDEX.bookPromises.has(bookKey)) return DOL_INDEX.bookPromises.get(bookKey);
  const p=(async()=>{
    const pages=(await dolDisplayStubPages()).filter(l=>dolBookKey(dolCanonicalDolMeta(l))===bookKey);
    const items=[...(DOL_INDEX.items||[])];
    const known=new Set(items.map(w=>w.id));
    for(let i=0;i<pages.length;i++){
      const l=pages[i];
      const lessonItems=await dolLoadLessonItems(l);
      if(!lessonItems) continue;
      for(let itemIndex=0;itemIndex<lessonItems.length;itemIndex++){
        const w=dolExpandItem(l,lessonItems[itemIndex],itemIndex);
        if(w&&!known.has(w.id)){ items.push(w); known.add(w.id); }
      }
      DOL_INDEX.items=items;
      DOL_INDEX.stamp=dolVocabStamp();
      if(i%2===1) await new Promise(r=>setTimeout(r,0));
    }
    DOL_INDEX.items=items;
    DOL_INDEX.loadedBooks.add(bookKey);
    DOL_INDEX.stamp=dolVocabStamp();
    DOL_VOCAB_CACHE={stamp:DOL_INDEX.stamp, items};
    DOL_INDEX.bookPromises.delete(bookKey);
    return items;
  })();
  DOL_INDEX.bookPromises.set(bookKey, p);
  return p;
}
async function dolEnsureIndex(opts={}){
  const stamp=dolVocabStamp();
  if(opts.bookKey) return dolEnsureBookIndex(opts.bookKey);
  const books=dolAllBookKeys();
  if(DOL_INDEX.loadedBooks.size===books.length&&books.length&&DOL_INDEX.stamp===stamp) return DOL_INDEX.items;
  if(DOL_INDEX.building&&DOL_INDEX.promise) return DOL_INDEX.promise;
  DOL_INDEX.building=true;
  DOL_INDEX.promise=(async()=>{
    for(const bk of books){
      await dolEnsureBookIndex(bk);
      await new Promise(r=>setTimeout(r,0));
    }
    DOL_INDEX.building=false;
    return DOL_INDEX.items;
  })();
  try{ return await DOL_INDEX.promise; }
  catch(e){ DOL_INDEX.building=false; throw e; }
  finally{ if(DOL_INDEX.loadedBooks.size===books.length) DOL_INDEX.promise=null; }
}

async function sectionReadScope(ev, accent){

  if(!scopeEl) return;

  const pageScope=scopeEl.matches('[data-page-read-scope]');
  const content=scopeEl.matches('[data-review-read-scope]')?scopeEl:(pageScope?document.getElementById('view'):(heading?heading.closest('.lesson-content'):(scopeEl.classList.contains('reading-passage')?scopeEl:scopeEl.querySelector('.lesson-content'))));

    READER_DOCK.paused=true;
    READER_DOCK.replayCurrent=false;
    stopAudio();
    readerDockRender();
  }
  scopeEl.classList.add('section-read-active');
  let i=0;
  while(i<units.length){
    if(SECTION_READ.cancel) break;
    await readerDockWaitForResume();
    if(SECTION_READ.cancel) break;
    if(READER_DOCK.jump!=null){ i=READER_DOCK.jump; READER_DOCK.jump=null; }
    READER_DOCK.index=i;
    const unit=units[i];
    if(!readerUnitEnabled(unit)){ i++; continue; }
    unit.target.classList.add('section-read-current');
    unit.target.scrollIntoView({behavior:'smooth',block:'nearest'});
    readerDockSetCurrent(unit.target,unit.text);
    if(unit.store&&unit.itemId) markReviewSeen(unit.store,unit.itemId);
    if(unit.kind==='word') await playWordAsync(unit.text,accent);
    else await playSentenceAsync(unit.text,accent);
    await readerDockWaitForResume();
    if(READER_DOCK.replayCurrent){ READER_DOCK.replayCurrent=false; continue; }
    if(!READER_DOCK.oneOnly) await readerDockWaitForGap();
    await readerDockWaitForStep();
    unit.target.classList.remove('section-read-current');
    if(READER_DOCK.jump!=null){ i=READER_DOCK.jump; READER_DOCK.jump=null; }
    else i++;

}

function dictionaryLemmaCandidates(value){

async function dictionarySourceExamples(word){

    Object.assign(state,defaults||{});

async function mergeUiPrefsFromDump(dump){
  const incoming=(dump.stores&&dump.stores.meta)||[];
  const rec=incoming.find(m=>m.k==='uiPrefs');
  if(!rec||!rec.v||typeof rec.v!=='object') return false;
  const local=await idbReq(db.transaction('meta').objectStore('meta').get('uiPrefs')).catch(()=>null);
  const localPrefs=(local&&local.v)||UIPREFS||{};

  const cloudAt=String(rec.updatedAt||(rec.v&&rec.v.updatedAt)||'');
  const localMs=Date.parse(localAt), cloudMs=Date.parse(cloudAt);
  const cloudIsNewer=Number.isFinite(cloudMs)&&(!Number.isFinite(localMs)||cloudMs>=localMs);
  const base=cloudIsNewer?rec.v:localPrefs;
  const merged=JSON.parse(JSON.stringify(base||{}));
  // Navigation is not resolved as one blob: every route/menu/history entry keeps

  merged.navigation=mergeNavigationPrefs((localPrefs&&localPrefs.navigation)||{},(rec.v&&rec.v.navigation)||{});
  const updatedAt=cloudIsNewer?(cloudAt||new Date().toISOString()):(localAt||new Date().toISOString());
  merged.updatedAt=updatedAt;
  await idbPut('meta',{k:'uiPrefs',v:merged,updatedAt});
  applyUiPrefs(merged);
  return cloudIsNewer||JSON.stringify(merged.navigation)!==JSON.stringify((localPrefs&&localPrefs.navigation)||{});
}
async function mergeNavigationFromDump(dump){
  const incoming=(dump.stores&&dump.stores.meta)||[];

  if(!cloudNav) return false;

  const hist=mergedNav.history||{};
  APP_NAV_HISTORY=(hist.items||[]).map(normalizeAppHistoryEntry).filter(Boolean);
  APP_NAV_INDEX=Math.max(-1,Math.min(APP_NAV_HISTORY.length-1,+hist.index||0));

}
function liveNavigationPrefs(){

  routePositions[currentHash]=routePositionSnapshot(scrollX,scrollY);
  updateCurrentAppHistoryPosition(currentHash,scrollX,scrollY,false);
  return {

    history:{items:JSON.parse(JSON.stringify(APP_NAV_HISTORY||[])),index:APP_NAV_INDEX},
    updatedAt:new Date().toISOString()

function mergeNavigationPrefs(localNav={},cloudNav={}){
  const localItems=((localNav.history&&localNav.history.items)||[]).map(normalizeAppHistoryEntry).filter(Boolean);
  const cloudItems=((cloudNav.history&&cloudNav.history.items)||[]).map(normalizeAppHistoryEntry).filter(Boolean);
  const routePositions={};
  for(const source of [localNav.routePositions||{},cloudNav.routePositions||{}]){
    for(const [hash,value] of Object.entries(source)){
      if(!hash.startsWith('#/')||!value||typeof value!=='object') continue;
      const entry={x:Math.max(0,Math.round(+value.x||0)),y:Math.max(0,Math.round(+value.y||0)),at:+value.at||0};
      if(value.anchor){entry.anchor=String(value.anchor);entry.anchorKind=value.anchorKind==='id'?'id':'data';entry.anchorOffset=Math.round(+value.anchorOffset||0);}
      if(value.listPageKey){entry.listPageKey=String(value.listPageKey);entry.listPage=Math.max(0,Math.round(+value.listPage||0));}
      if(!routePositions[hash]||entry.at>=(+routePositions[hash].at||0)) routePositions[hash]=entry;
    }
  }
  const menuRoutes={};
  for(const source of [localNav.menuRoutes||{},cloudNav.menuRoutes||{}]){
    for(const [section,value] of Object.entries(source)){
      const incoming=normalizeMenuRouteRecord(value);
      if(!incoming.home&&!incoming.detail) continue;
      if(!menuRoutes[section]) menuRoutes[section]={};
      for(const kind of ['home','detail']){
        const entry=incoming[kind];
        if(entry&&(!menuRoutes[section][kind]||(+entry.at||0)>=(+menuRoutes[section][kind].at||0))) menuRoutes[section][kind]=entry;
      }
    }
  }
  const key=e=>JSON.stringify({hash:e.hash,x:e.x,y:e.y,anchor:e.anchor||'',anchorOffset:e.anchorOffset||0,listPageKey:e.listPageKey||'',listPage:e.listPage||0,listening:e.listening||null});
  const byKey=new Map();
  for(const e of localItems.concat(cloudItems)){
    const k=key(e), cur=byKey.get(k);
    if(!cur||(+e.at||0)>=(+cur.at||0)) byKey.set(k,e);
  }
  let items=[...byKey.values()].sort((a,b)=>(+a.at||0)-(+b.at||0));
  let index=items.length-1;
  if(items.length>APP_NAV_HISTORY_LIMIT){
    const before=Math.min(index,Math.floor(APP_NAV_HISTORY_LIMIT*.7)),start=Math.max(0,Math.min(index-before,items.length-APP_NAV_HISTORY_LIMIT));
    items=items.slice(start,start+APP_NAV_HISTORY_LIMIT); index-=start;
  }
  return {routePositions,menuRoutes,history:{items,index:Math.max(-1,Math.min(items.length-1,index))},updatedAt:new Date().toISOString()};
}

const CARD_SOURCE_OPTS=[
  ['','All sources'],
  ['lesson','📚 AI Topics'],
  ['dol','📖 Vocab'],
  ['bbc','🎧 BBC 6 Minutes'],

  ['news','📰 Daily news'],

function itemSourceKind(lessonId){
  if(!lessonId) return 'other';
  const rawId=String(lessonId);
  if(rawId.startsWith('sp-')||speakingById(lessonId)) return 'speaking';
  // DOL lesson bodies are intentionally demand-loaded, so Words/Sentences
  // must recognize their stable source ids without requiring a live lesson stub.
  if(isDolId(rawId)||rawId.startsWith('dol-vocab')) return 'dol';
  const l=lessonById(lessonId);
  if(!l) return 'other';
  if(isBbcLike(l)) return 'bbc';
  if(isDolLike(l)) return 'dol';
  if(isLessonLike(l)) return 'lesson';
  const type=(l.type||'').toLowerCase();
  const cat=(l.category||'').toLowerCase();
  if(type==='brief'||cat.includes('morning-brief')) return 'brief';
  if(cat.includes('worldcup')||type.includes('worldcup')) return 'worldcup';
  if(type==='news'||cat.includes('daily-news')) return 'news';
  if(type&&type!=='lesson') return type;
  return 'other';
}

      DOL_CARDS_BOOTING=true;
      dolCardsBootstrap().then(()=>{
        DOL_CARDS_BOOTING=false;
        if(location.hash.startsWith('#/cards')) renderCards(true);
      }).catch(e=>{
        console.warn('cards dol bootstrap',e);
        DOL_CARDS_BOOTING=false;
        if(location.hash.startsWith('#/cards')) renderCards(true);
      });
      if(dolOnly){
        $('#view').innerHTML='<section class="panel"><h2>🃏 Flashcards</h2><p class="dol-loading note">Loading Cam 16–20 DOL cards…</p></section>';
        return;
      }
    }
  }
  cardsEnsureDeck(false);
  const pool=cardsRawItems().length;
  const n=CF.order.length;
  const active=cardsActiveFilters();
  const countLbl=n!==pool?fmtOf(n,pool,'cards'):fmtNum(n)+' card'+(n===1?'':'s');
  const filterLbl=active.length?(' · filtered: '+active.join(', ')):'';
  const it=n?CF.order[Math.min(CF.pos,n-1)]:null;
  const rec=it?(it.store==='words'?S.words:S.sentences).get(it.id):null;
  const conf=rec?(rec.confidence||0):0;
  const idq=it?it.id.replace(/'/g,"\\'"):'';
  if(it) cardsMarkSeen(it);
  const seenLbl=it?cardsSeenLabel(it):'';
  $('#view').innerHTML=`
  <section class="panel">
    <h2>🃏 Flashcards <span class="note">(${countLbl}${filterLbl})</span></h2>
    <div class="filters">
      ${orderSelectHTML('CF',CF.listOrder)}
      ${diffFilterSelectHTML(CF,'CF','cardsReset()')}
      <select onchange="if(this.value!=='dol-words'){CF.dolGroup='';CF.dolBook='';CF.dolTest='';CF.dolPassage='';}CF.deck=this.value;cardsReset()">
        <option value="all-lesson-words" ${CF.deck==='all-lesson-words'?'selected':''}>All lesson words</option>
        <option value="dol-words" ${CF.deck==='dol-words'?'selected':''}>📖 DOL Vocab (deduped)</option>
        <option value="flagged-words" ${CF.deck==='flagged-words'?'selected':''}>Confidence-rated words</option>
        <option value="flagged-sentences" ${CF.deck==='flagged-sentences'?'selected':''}>📌 Flagged sentences only</option>
        <option value="flagged-both" ${CF.deck==='flagged-both'?'selected':''}>Rated words and 📌 sentences</option>
        <option value="all-types" ${CF.deck==='all-types'||CF.deck==='both'?'selected':''}>All types</option>
      </select>
      <select onchange="CF.source=this.value;CF.topic='';cardsReset()">
        ${CARD_SOURCE_OPTS.map(([v,lbl])=>`<option value="${v}" ${CF.source===v?'selected':''}>${lbl}</option>`).join('')}
      </select>
      ${(CF.source==='lesson'||CF.source==='speaking')?`<select onchange="CF.topic=this.value;cardsReset()"><option value="">All topics</option>${(CF.source==='speaking'?S.speaking.map(x=>['sp:'+x.id,x.topic]):topicOptions()).map(([v,l])=>`<option value="${esc(v)}" ${CF.topic===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`:''}
      <select onchange="CF.front=this.value;CF.stage=0;CF.peek=null;CF.lastSpoken='';saveUiPrefsSoon();renderCards();cardsMaybeSpeak()">
        <option value="en" ${CF.front==='en'?'selected':''}>Front: English</option>
        <option value="vn" ${CF.front==='vn'?'selected':''}>Front: Vietnamese</option>
      </select>
      <select onchange="CF.confFilter=this.value||'all';cardsReset()">${confFilterOptions(CF.confFilter)}</select>
      ${cardsSeenFilterOptions(CF.seenFilter)}
      <label class="note"><input type="checkbox" ${CF.speakOnShow?'checked':''} onchange="CF.speakOnShow=this.checked;CF.lastSpoken='';saveUiPrefsSoon();cardsMaybeSpeak()"> 🔊 Speak English when shown</label>
      <label class="note"><input type="checkbox" ${CF.includeExampleSpeak?'checked':''} onchange="CF.includeExampleSpeak=this.checked;CF.lastSpoken='';saveUiPrefsSoon();cardsMaybeSpeak()"> Include example speaking</label>
      <label class="note"><input type="checkbox" ${CF.showAltExampleIpa?'checked':''} onchange="CF.showAltExampleIpa=this.checked;saveUiPrefsSoon();renderCards()"> Include non-default IPA for Example</label>
      <button class="btn small" onclick="cardsShuffle()">🔀 Shuffle</button>
    </div>
    ${CF.deck==='dol-words'?cardsDolFiltersHTML():''}
    ${it?`
    <div class="fcard${CF.stage?' stage-reveal':''}" onclick="cardsCardClick(event)">
      <div class="fcard-head">
        <span class="side-label">${CF.stage===0?(CF.front==='en'?'Front — English':'Front — Tiếng Việt'):'Answer + confidence'}</span>
        <span class="typechip">${it.type==='word'?'⭐ word':'📌 sentence'} · ${conf}%${it.diffLabel?' · '+esc(it.diffLabel):''}</span>
        <span class="fstage-tag">${cardsStageLabel()} · Card ${fmtNum(Math.min(CF.pos,n-1)+1)} / ${fmtNum(n)}</span>
      </div>
      <div class="fcard-body">${cardsBodyHtml(it,rec,conf)}</div>
    </div>
    <div class="fcontrols">
      <button class="btn" onclick="cardsMove(-1)">‹ Prev card</button>
      <button class="btn primary" onclick="cardsAdvance()">${CF.stage<1?'Reveal ›':'Next card ›'}</button>
      <button class="btn" onclick="cardsMove(1)">Skip ›</button>
    </div>
    <div class="fmeta">
      <span class="review-meta-left"><span class="note" title="Times this card was shown in the Cards section">${esc(seenLbl)}</span></span>
      <span class="review-meta-right">${(()=>{ const lid=it.lessonId||(rec&&rec.lessonId)||''; const src=srcInfo(lid);
        if(!src) return '';
        return `<a class="btn small" href="${esc(reviewSourceUrl(Object.assign({},rec||{},it),it.type))}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open the original source at this ${it.type}">↗ ${esc(src.label)}</a>`; })()}</span>
    </div>
    ${CF.stage>0?`<div class="fconf-panel cards-confidence-row review-conf-row"><span class="lbl">Confidence</span>${confBtnsHTML(conf,`setItemConf('${it.store}','${it.id.replace(/'/g,"\\'")}',LVL)`)}</div>`:''}
    <p class="cards-hint">${cardsHint()}</p>`
    :`<div class="empty">${CF.deck==='dol-words'&&!DOL_INDEX.items.length&&!DOL_CARDS_BOOTING?'Cam 16–20 DOL cards not ready yet — wait a moment or load books from Data tab.':CF.deck==='dol-words'&&DOL_CARDS_BOOTING?'Loading Cam 16–20 DOL cards…':'No cards match these filters — try another deck or source, relax confidence/level filters, or switch seen filter.'}</div>
    <p class="cards-hint">${cardsHint()}</p>`}
    ${reviewBottomNavHTML('cards')}
  </section>`;
  cardsMaybeSpeak();
  scheduleIpaLabelRefresh();
}
document.addEventListener('keydown',ev=>{
  if(!location.hash.startsWith('#/cards')) return;
  if(ev.target&&ev.target.closest&&ev.target.closest('input,textarea,select,button')) return;
  if(ev.key==='ArrowRight'){ ev.preventDefault(); cardsMove(1); }
  else if(ev.key==='ArrowLeft'){ ev.preventDefault(); cardsMove(-1); }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); cardsPeek('en'); }
  else if(ev.key==='ArrowDown'){ ev.preventDefault(); cardsPeek('vn'); }
  else if(ev.key==='Enter'||ev.key===' '||ev.key==='Tab'){
    if(cardsHasTextSelection()) return;
    ev.preventDefault(); cardsAdvance();
  }
});

/* ================= data view (reload / export / import / files) ================= */
function renderData(){
  $('#view').innerHTML=`
  <section class="panel">
    <h2>💾 Data &amp; backup</h2>

    <h3>📊 DOL book stats (lượt làm)</h3>
    <div id="dolStatsPanel"><p class="note">Loading DOL stats…</p></div>

    <h3>Lesson data</h3>
    <p class="note">Lesson content lives in the <code>.json</code> files next to this page (listed in <code>manifest.json</code>);
      speaking practice comes from <code>0.speaking.json</code>.
      Your completion progress, item confidence, flags, study history, and Vietnamese edits are stored separately in the browser's IndexedDB and are never touched by a data reload.</p>
    <p><button class="btn primary" id="dataReloadBtn" onclick="reloadData()"${appReady?'':' disabled'}>⟳ Reload lesson data from manifest.json</button>
       ${S.reloadReport?'<button type="button" class="btn small" onclick="showReloadReport(S.reloadReport)">View last reload report</button>':''}</p>
    <div id="dataReloadReport">${reloadReportHTML(S.reloadReport)}</div>

    <h3>📖 DOL vocab — IndexedDB</h3>
    <p class="note"><b>All downloadable DOL pages</b> load automatically after the current lesson data is ready. The background queue downloads one page at a time and reveals it immediately; it yields between requests so the app remains responsive.</p>
    <p class="note" id="dolIdbStats">Checking DOL storage…</p>
    <p>
      <button class="btn" onclick="dolCleanIdbKeepCam16to20()">🧹 Clean DOL data (keep Cam 16–20 only)</button>
      <button class="btn primary" id="dolLoadBtn" onclick="dolLoadNextBooks(5)">📥 Load next 5 DOL books</button>
    </p>

    <h3>☁ S3 — user data sync only</h3>
    <p class="note">Bucket: <code>${esc(S3_BASE)}</code></p>
    <p class="note">S3 stores three independent user files: <code>user-core.json</code> (completion, item confidence, flags, bookmarks and edits),
      <code>user-activity.json</code> (study history), and <code>user-cache.json</code> (translations, examples, filters, expanded state, and page/navigation history).
      Reload merges each file record-by-record; deleting the cache file is safe. <b>Study content</b> is always loaded from the JSON files next to this app, never from S3.</p>
    <p><button class="btn primary" onclick="saveToS3()">☁ Save to S3 now</button> <span class="note" id="lastS3"></span></p>

    <p class="note">Opened directly from disk (file://) and fetch is blocked? Pick the JSON files manually:</p>
    <p><input type="file" id="lessonFiles" multiple accept=".json">
       <button class="btn" onclick="importLessonFiles($('#lessonFiles').files)">Load selected lesson files</button></p>

    <h3>Backup / migrate (whole IndexedDB)</h3>
    <p><button class="btn primary" onclick="exportAll()">⬇ Export everything to .json</button></p>
    <p><input type="file" id="backupFile" accept=".json">
       <button class="btn" onclick="importAll(false)">⬆ Import (replace all)</button>
       <button class="btn" onclick="importAll(true)">⬆ Import (merge, keep existing)</button></p>
    <p class="note">“Replace all” overwrites every store (lessons cache + progress + words + sentences + history).
      “Merge” only adds records whose keys don't exist yet.</p>

    <h3>Storage status</h3>
    <p class="note" id="storState">Checking…</p>
  </section>`;
  ensureDolBookStats().then(()=>{
    const el=$('#dolStatsPanel');
    if(el) el.innerHTML=dolStatsTableHTML(DOL_BOOK_STATS);
  }).catch(()=>{
    const el=$('#dolStatsPanel');
    if(el) el.innerHTML='<p class="note">Could not load dol-book-stats.json</p>';
  });
  updateStorState();
  dolIdbStatsLine().then(t=>{ const el=$('#dolIdbStats'); if(el) el.textContent=t; }).catch(()=>{});
  idbReq(db.transaction('meta').objectStore('meta').get('lastS3Save'))
    .then(v=>{ const el=$('#lastS3'); if(el&&v) el.innerHTML='Last saved: '+agoInfo(v.v); }).catch(()=>{});
}
async function updateStorState(){
  let txt='IndexedDB: '+(db?'open':'unavailable');
  try{
    if(navigator.storage&&navigator.storage.persisted){
      const p=await navigator.storage.persisted();
      txt+=' · Persistent storage: '+(p?'✅ granted (browser will not evict this data)':'⚠ not granted — data still persists across reloads, but keep regular exports as backup');
    }
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      txt+=' · Used ~'+fmtNum(Math.round((e.usage||0)/1024))+' KB';
    }
  }catch(e){}
  const el=$('#storState'); if(el) el.textContent=txt;
}
async function exportAll(){
  await ensureDb();
  await flushStudy();
  await flushUiPrefs();
  const dump={app:'ielts-hourly-practice-tool',schema:1,exportedAt:new Date().toISOString(),stores:{}};
  for(const st of STORES) dump.stores[st]=await idbAll(st);
  const blob=new Blob([JSON.stringify(dump)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ielts-practice-backup-'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup exported.');
}
async function importAll(merge){
  await ensureDb();
  const f=$('#backupFile').files[0];
  if(!f){ toast('Choose a backup .json file first.'); return; }
  let dump;
  try{ dump=JSON.parse(await f.text()); }catch(e){ toast('Not a valid JSON file.'); return; }
  if(!dump.stores){ toast('Not a backup made by this tool (missing "stores").'); return; }
  if(!merge&&!confirm('Replace ALL current progress with the backup file? This cannot be undone.')) return;
  for(const st of STORES){
    const items=dump.stores[st]||[];
    if(!merge){ await idbClear(st); await idbPutMany(st,items); }
    else{
      const existing=new Set((await idbAll(st)).map(x=>x.id||x.key||x.k));
      await idbPutMany(st,items.filter(x=>!existing.has(x.id||x.key||x.k)));
    }
  }
  await loadState({deferMaintenance:true, skipDol:true, loadLessons:true}); renderHero(); route();
  toast('Import complete ('+(merge?'merge':'replace')+').');
}

/* ================= boot ================= */
(async function(){
  // Persistence permission can remain pending indefinitely in embedded/local
  // browsers. It is optional, so never hold the whole app boot behind it.
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().then(v=>{S.persisted=!!v;}).catch(()=>{}); }catch(e){}
  try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){}
  await ensureDb();
  await probeAppEditedAt();
  loadDolManifestStats().then(()=>{
    renderHero();
    if(location.hash.startsWith('#/words')||location.hash.startsWith('#/sentences')) route();
  }).catch(()=>{});
  await loadState({deferMaintenance:true, skipDol:true, loadLessons:false});
  updateGlobalToggles();
  renderHero();
  startHeroTick();
  route();
  await loadCachedNonDolLessons();
  // The first route renders before the larger lesson cache is hydrated. Render
  // it once more so direct reloads of list/detail URLs show their real data and
  // can resolve saved history anchors immediately.
  route();
  if(!S.speaking.length) await reloadData(true);
  else setTimeout(()=>deferredLoadMaintenance(), 800);
  appReady=true;
  setReloadUi(false);
  // DOL data is demand-loaded from its filters/tree or the explicit load button.
})().catch(e=>{
  console.error('boot failed',e);
  toast('App failed to start ('+e.message+'). Try refreshing the page.', TOAST_MS*4);
  appReady=true;
  setReloadUi(false);
});
window.addEventListener('pagehide',()=>{ flushUiPrefs(); });
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden') flushUiPrefs();
  else renderHeroMeta();
});
</script>
