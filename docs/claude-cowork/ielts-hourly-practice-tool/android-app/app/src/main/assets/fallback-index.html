async function translateVi(text){
  const raw=String(text||'').trim();
  const k=raw.toLowerCase();
  if(!k) return '';
  if(viCache.has(k)){
    const cached=viCache.get(k);
    if(validViTranslation(cached)) return cached;
    viCache.delete(k);
  }
  try{
    const c=await idbReq(db.transaction('meta').objectStore('meta').get('tr:'+k));
    if(c&&c.v){
      const v=decodeEntities(c.v);
      if(validViTranslation(v)){ viCache.set(k,v); return v; }   // decode old cached values too
    }
  }catch(e){}
  if(raw.length>VI_TRANSLATE_QUERY_LIMIT){
    const translated=[];
    for(const chunk of viTranslationChunks(raw)){
      const part=await translateVi(chunk);
      if(!part) return '';
      translated.push(part);
    }
    const out=translated.join(' ').trim();
    if(out){
      viCache.set(k,out);
      try{ await idbPut('meta',{k:'tr:'+k,v:out,updatedAt:new Date().toISOString()}); }catch(e){}
    }
    return out;
  }
  let out='';
  try{
    const r=await fetchWithTimeout('https://api.mymemory.translated.net/get?q='+encodeURIComponent(raw)+'&langpair=en|vi',{},7000);
    if(r.ok){
      const j=await r.json();
      out=String((j.responseData&&j.responseData.translatedText)||'').trim();
      if(!validViTranslation(out)) out='';
    }
  }catch(e){}
  if(!out){
    try{
      const r=await fetchWithTimeout('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q='+encodeURIComponent(raw),{},7000);
      if(r.ok){ const j=await r.json(); out=String((j[0]||[]).map(s=>(s&&s[0])||'').join('')).trim(); }
    }catch(e){}
  }
  out=decodeEntities(out);
  if(!validViTranslation(out)) out='';
  if(out) viCache.set(k,out);
  if(out){ try{ await idbPut('meta',{k:'tr:'+k,v:out,updatedAt:new Date().toISOString()}); }catch(e){} }
  return out;
}
function pointInClientRect(x,y,r,padding){

function textTokenAtPoint(x,y,englishOnly){
  const hit=document.elementFromPoint(x,y);

  const pattern=englishOnly?/[A-Za-z][A-Za-z'’-]*/g:/\S+/gu;

    const owner=node.parentElement;
    if(!owner||owner.closest('button,a,input,textarea,select,.ipa,.ipat,.ipa-row,.pron,.sound-pair,.confbtns,#wordpop,#selpop')) continue;
    pattern.lastIndex=0;
    let match;
    while((match=pattern.exec(node.nodeValue||''))){
      const range=document.createRange();
      range.setStart(node,match.index); range.setEnd(node,match.index+match[0].length);
      if([...range.getClientRects()].some(rect=>pointInClientRect(x,y,rect,1))) return match[0];
    }

function wordAtPoint(x,y){

    const p=document.caretPositionFromPoint(x,y);
    if(p){ range=document.createRange(); range.setStart(p.offsetNode,p.offset); range.collapse(true); }
  }
  if(!range||range.startContainer.nodeType!==3) return textTokenAtPoint(x,y,true)||null;
  const text=range.startContainer.textContent||'';
  let i=range.startOffset;
  const isW=c=>!!c&&/[\p{L}’'-]/u.test(c);
  if(!isW(text[i])) return null;                         // whitespace / padding — never snap to a neighbour
  let s=i,e=i;

  while(e<text.length&&isW(text[e])) e++;
  const w=text.slice(s,e).replace(/^['’-]+|['’-]+$/g,'');
  if(!/^[A-Za-z][A-Za-z'’-]*$/.test(w)) return null;
  try{
    const wr=document.createRange();
    wr.setStart(range.startContainer,s);
    wr.setEnd(range.startContainer,e);
    const rects=wr.getClientRects();
    for(let ri=0;ri<rects.length;ri++){
      if(pointInClientRect(x,y,rects[ri])) return w;
    }

  }catch(err){ return null; }
}

    if(tapState.count>=3){ tapState.count=0; wordPopupAt(tapState.x,tapState.y,ipaAlt()); }

      tapState.timer=setTimeout(()=>{ if(tapState.count===2){ tapState.count=0; wordPopupAt(tapState.x,tapState.y,ipaDefault()); } },TAP_RESOLVE_MS);
    }
  }else if(ev.detail===1){                              // desktop: single left-click = primary
    wordPopupAt(ev.clientX,ev.clientY,ipaDefault());
  }
});

async function setCompletion(key,level){
  level=Math.max(0,Math.min(100,+level||0));
  // Keep a timestamped 0% tombstone so a later S3 merge cannot resurrect an
  // older completion value from another browser.
  const rec={key,completion:level,updatedAt:new Date().toISOString()};
  S.completions.set(key,rec); await idbPut('progress',rec);
  if((level===0||level===100)&&key.includes('|L3|')){
    const childPrefix=key.replace('|L3|','|L4|')+'|', childKeys=new Set();
    for(const childKey of S.completions.keys()) if(childKey.startsWith(childPrefix)) childKeys.add(childKey);
    document.querySelectorAll('[data-completion-key]').forEach(btn=>{ const child=decodeURIComponent(btn.dataset.completionKey||''); if(child.startsWith(childPrefix)) childKeys.add(child); });
    if(key.startsWith('completion|dol-listening|')){
      const man=await listenManifest();
      for(const test of man.tests||[]) if(dolListeningCompletionKey(3,test)===key) for(let i=1;i<=+(test.sectionCount||0);i++) childKeys.add(dolListeningCompletionKey(4,test,i));
    }else if(key.startsWith('completion|dol-reading|')){
      const man=await dolReadingManifest();
      for(const test of man.tests||[]) if(dolReadingCompletionKey(3,test)===key) for(let i=1;i<=+(test.passageCount||0);i++) childKeys.add(dolReadingCompletionKey(4,test,'Passage '+i));
    }else if(key.startsWith('completion|dol-vocab|')){
      const pages=await dolDisplayStubPages(), page=pages.find(x=>dolVocabCompletionKey(3,x)===key);
      if(page){ let lesson=lessonById(page.id); if(!lesson||!lesson.sections?.length){ await dolLoadLessonDetail(page.id); lesson=lessonById(page.id); }
        for(const section of lesson?.sections||[]) if(!/^(sources?|nguồn)$/i.test(String(section.title||'').trim())) childKeys.add(dolVocabCompletionKey(4,lesson,section.title||section.id)); }
    }
    for(const childKey of childKeys){ const childRec={key:childKey,completion:level,updatedAt:rec.updatedAt}; S.completions.set(childKey,childRec); await idbPut('progress',childRec); }
  }
  document.querySelectorAll('[data-completion-key]').forEach(btn=>{
    const buttonKey=decodeURIComponent(btn.dataset.completionKey||'');
    const affected=buttonKey===key||((level===0||level===100)&&key.includes('|L3|')&&buttonKey.startsWith(key.replace('|L3|','|L4|')+'|'));
    if(affected) btn.classList.toggle('done',+btn.dataset.completionLevel===completionValue(buttonKey));
  });
  toast('Completion '+level+'% ✓');
  renderHero();
  const parts=(location.hash||'#/dashboard').slice(2).split('/');
  if(parts[0]==='listening'&&!parts[1]&&LSF.conf)renderListening();
  else if(parts[0]==='dol-reading'&&!parts[1]&&DRF.conf)renderDolReading();
  else if(parts[0]==='dol'&&!parts[1]&&DDF.conf)renderDolDetails();
}

  const u=dolUiMeta(dolCanonicalDolMeta(x));
  return completionKey('dol-vocab',level,level===3?[u.l1,u.l2,u.l3]:[u.l1,u.l2,u.l3,label||u.l4||'']);
}
function dolReadingCompletionKey(level,x,passage){
  return completionKey('dol-reading',level,[x.group,x.book,'Reading Test '+(x.testNum||''),...(level===4?[passage||'']:[])]);
}

  return completionKey('dol-listening',level,[x.group,x.book,'Listening Test '+(x.testNum||''),...(level===4?['Section '+section]:[])]);

async function setWholeCompletion(id,sectionIds,level){

async function setItemConf(store,id,level){
  const preserveSound=audioIsPlaying();

      indexed.confidence=rec.confidence||0;
      indexed.flagged=true;
      indexed.addedAt=rec.addedAt||indexed.addedAt;
      if(rec.vn) indexed.vn=rec.vn;
      if(rec.ipa) indexed.ipa=rec.ipa;

  const inLessonView=!!document.querySelector('#view .lesson-content');
  if(!READER_DOCK.active&&!preserveSound&&!audioIsPlaying()&&!inLessonView) route();
  renderHero();

async function removeGlobalReviewMatches(store,rec){
  if(!rec) return;
  const map=store==='words'?S.words:S.sentences;
  const norm=store==='words'?normWordKey:normSentenceKey;
  const key=norm(store==='words'?(rec.text||rec.en):(rec.en||rec.text));

    .filter(other=>norm(store==='words'?(other.text||other.en):(other.en||other.text))===key)

async function dolReadingTranslate(en){
  const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q='+encodeURIComponent(en);
  const res=await fetch(url); if(!res.ok) throw new Error('translation '+res.status);
  const data=await res.json(); return (data[0]||[]).map(part=>part[0]||'').join('').trim();

async function dolReadingHydrateTranslations(root){
  const store=dolReadingTranslationStore();
  const jobs=[...root.querySelectorAll('.reading-translation[data-en]')];
  const keepActivePairVisible=el=>{
    const en=el.previousElementSibling;
    if(READER_DOCK.active&&en&&READER_DOCK.currentEl===en) readerDockSetCurrent(en,READER_DOCK.label);
  };
  for(const el of jobs){
    const en=el.dataset.en||'',key=el.dataset.translationKey||'';
    if(store[key]){el.textContent=store[key];el.classList.remove('note');keepActivePairVisible(el);continue;}
    try{const vi=await dolReadingTranslate(en);if(vi){store[key]=vi;el.textContent=vi;el.classList.remove('note');dolReadingTranslationSave(store);}else throw new Error('empty');}
    catch(e){el.textContent='Không thể dịch tự động. Hãy thử tải lại trang.';}

  }

function dolReadingSentences(value){
  const source=String(value||'').replace(/\s+/g,' ').trim(); if(!source)return [];
  try{
    if(typeof Intl!=='undefined'&&Intl.Segmenter){
      const rows=[...new Intl.Segmenter('en',{granularity:'sentence'}).segment(source)].map(x=>x.segment.trim()).filter(Boolean);
      if(rows.length)return rows;
    }
  }catch(e){}
  return source.split(/(?<=[.!?])\s+(?=[A-Z“"'])/).map(x=>x.trim()).filter(Boolean);
}

  const F=activeListFilter();

    if(F.l3&&ui.l3!==F.l3) return false;

}

function summaryLines(sum,lang){
  if(!sum||typeof sum!=='object') return [];
  const v=sum[lang];
  if(Array.isArray(v)) return v.filter(Boolean).map(String);
  if(v) return [String(v)];
  return [];
}
function summaryBlockHTML(sum){
  const ens=summaryLines(sum,'en'), vis=summaryLines(sum,'vi');
  if(!ens.length&&!vis.length) return '';
  const pairs=[];
  for(let i=0;i<Math.max(ens.length,vis.length);i++){
    if(ens[i]) pairs.push('<p class="en">'+esc(ens[i])+'</p>');
    if(vis[i]) pairs.push('<p class="vi">'+esc(vis[i])+'</p>');
  }
  return pairs.join('');
}
function othersSummaryPresent(l){
  return !!summaryBlockHTML(l.summary);
}
function linksFromHtml(html){
  const out=[];
  if(!html) return out;
  const re=/<a\s+[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;
  let m;
  while((m=re.exec(html))){
    const url=m[1].trim();
    if(!/^https?:\/\//i.test(url)) continue;
    const name=m[2].replace(/<[^>]+>/g,'').trim()||url;
    out.push({url,name});
  }
  return out;
}
function dedupeSourceLinks(list){
  const seen=new Map();
  list.forEach(s=>{
    if(!s||!s.url) return;
    const key=s.url.replace(/#.*$/,'').replace(/\/+$/,'').toLowerCase();
    if(!seen.has(key)) seen.set(key,{url:s.url,name:s.name||s.url});
  });
  return [...seen.values()];
}
function collectOtherSources(l){
  const out=[];
  (l.sourceNotes||[]).forEach(n=>{
    if(n&&n.url) out.push({url:n.url,name:n.name||n.url});
  });
  (l.sources||[]).forEach(s=>{
    if(typeof s==='string'){
      const urlM=s.match(/https?:\/\/[^\s"']+/);
      if(urlM) out.push({url:urlM[0],name:s.replace(urlM[0],'').replace(/[—–-]\s*$/,'').trim()||urlM[0]});
      return;
    }
    if(s&&s.url) out.push({url:s.url,name:s.name||s.description||s.url});
  });
  (l.sections||[]).forEach(sec=>{ out.push(...linksFromHtml(sec.html)); });
  return dedupeSourceLinks(out);
}
function otherSourceLabel(source){
  const name=String(source.name||source.url||'').trim();
  if(name&&name!==source.url) return name;
  try{
    const u=new URL(source.url,location.href), host=u.hostname.replace(/^www\./i,'');
    const path=u.pathname.split('/').filter(Boolean);
    if(host.toLowerCase()==='github.com'&&path.length>=2) return host+'/'+path.slice(0,2).join('/');
    const withPath=host+(path.length?'/'+path.join('/'):'');
    if(path.length&&withPath.length<=52) return withPath;
    return host||name;
  }catch(e){ return name; }
}

function cleanVocabSections(root){
  // vocab sections: remove any leftover Meaning/Example markers (data is pre-cleaned by
  // convert_lessons.py; this is a safety net) and colour-code definition vs example lines.
  for(const sec of root.querySelectorAll('.lesson-content')){
    if(!(sec.dataset.sec||'').startsWith('vocab')) continue;
    sec.querySelectorAll('.label,.tag').forEach(el=>{
      if(/^(meaning|definition|examples?(\s+sentences?)?)\s*:?$/i.test(el.textContent.trim())) el.remove();
    });
    const counts=new Map();          // per-card counter: first EN line = definition, rest = examples
    sec.querySelectorAll('.en').forEach(el=>{
      let mode=null;
      if(/^\s*Meaning\s*:/i.test(el.textContent)){ mode='def'; el.innerHTML=el.innerHTML.replace(/^(\s*)Meaning\s*:\s*/i,'$1'); }
      else if(/^\s*Examples?\s*:/i.test(el.textContent)){ mode='ex'; el.innerHTML=el.innerHTML.replace(/^(\s*)Examples?\s*:\s*/i,'$1'); }
      const block=(el.parentElement&&el.parentElement.closest('div,li'))||sec;
      const n=counts.get(block)||0;
      if(!mode) mode=n===0?'def':'ex';
      el.classList.add(mode==='def'?'defline':'exline');
      counts.set(block,n+1);
    });
    sec.querySelectorAll('.vi,.vn').forEach(el=>{
      el.innerHTML=el.innerHTML.replace(/^(\s*(?:<em[^>]*>\s*)?)(?:Nghĩa|Ý nghĩa|Ví dụ|VD)\s*:\s*/i,'$1');
    });
  }
}
function viSiblingOf(el){
  let sib=el.nextElementSibling;
  while(sib){
    if(sib.classList&&(sib.classList.contains('vi')||sib.classList.contains('vn'))) return sib;
    if(sib.classList&&(sib.classList.contains('en')||sib.matches('h2,h3,h4'))) break;
    sib=sib.nextElementSibling;
  }
  return null;
}

function bbcAutoViText(el){

  return clone.textContent.replace(/([\p{L}])\?([\p{L}])/gu,'$1’$2').replace(/\s+/g,' ').trim();

function bbcViLooksCorrupt(value){
  const text=String(value||'').trim(); if(!text) return false;

function completeBbcTranslations(root){
  const pending=[];

    if(en.querySelector('.en') || en.matches('.pattern-block,.question-block')) return;
    const text=bbcAutoViText(en); if(!text) return;
    let vi=viSiblingOf(en);
    const needs=!vi || !vi.textContent.trim() || vi.dataset.autoVi==='1' || bbcViLooksCorrupt(vi.textContent);
    if(!needs) return;
    if(!vi){ vi=document.createElement('p'); vi.className='vi auto-vi'; en.insertAdjacentElement('afterend',vi); }
    vi.dataset.autoVi='1'; vi.textContent='Đang dịch…'; pending.push([text,vi]);
  });

  // translation services throttle bursts. Cached lines resolve without a network call.

function normalizeLessonDetailMarkup(root){
  root.querySelectorAll('.lesson-content .label,.lesson-content .lbl,.lesson-content .vocab-label').forEach(label=>{
    if(!/^examples?(?:\s+sentences?)?\s*:?$/i.test(label.textContent.trim())) return;
    const example=label.closest('.vocab-row,.example,.example-block,.example-sentence,.ex')||label.parentElement;
    if(example) example.classList.add('global-example');
    label.remove();
  });
  root.querySelectorAll('.lesson-content p.en,.lesson-content p.vn,.lesson-content p.vi').forEach(p=>{
    if(!/\n\s*\n/.test(p.innerHTML)) return;
    const parts=p.innerHTML.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);
    if(parts.length<2) return;
    const frag=document.createDocumentFragment();
    parts.forEach(part=>{
      const line=p.cloneNode(false);
      line.innerHTML=part.replace(/^\s*\*\*([^*]{1,60}:)\*\*\s*/,'<strong>$1</strong> ');
      line.classList.add('multiline-part');
      if(/^\s*(?:<strong>[^<]{1,60}:<\/strong>|\*\*[^*]{1,60}:\*\*)/i.test(part)) line.classList.add('dialogue-line');
      frag.appendChild(line);
    });
    p.replaceWith(frag);
  });
  root.querySelectorAll('.lesson-content table').forEach(table=>{
    if(table.parentElement?.classList.contains('lesson-table-scroll')) return;
    const wrap=document.createElement('div');
    wrap.className='lesson-table-scroll';
    table.before(wrap); wrap.appendChild(table);
  });
}

async function dolLoadLessonItems(l){
  if(db.objectStoreNames.contains('dolItems')){
    const rec=await idbGet('dolItems', l.id);
    if(rec&&Array.isArray(rec.items)&&rec.items.length) return rec.items;
  }
  const legacy=await idbGet('lessons', l.id);
  if(legacy&&Array.isArray(legacy.items)&&legacy.items.length){
    if(db.objectStoreNames.contains('dolItems')) await idbPut('dolItems',{id:l.id, items:legacy.items});
    return legacy.items;
  }
  if(l.sourceFile){
    try{
      const r=await fetchWithTimeout(l.sourceFile+'?v='+(l.contentHash||Date.now()),{cache:l.contentHash?'default':'no-store'},8500);
      if(!r.ok) return null;
      const obj=await r.json();
      if(Array.isArray(obj.items)&&obj.items.length){
        if(db.objectStoreNames.contains('dolItems')) await idbPut('dolItems',{id:l.id, items:obj.items});
        return obj.items;
      }
    }catch(e){ console.warn('dol items fetch',l.id,e); }
  }
  if(l.id){
    const fallbackFile='data/chatgpt/dol/dol-gpt-'+dolQueueKeyFromId(l.id)+'.json';
    if(fallbackFile!==l.sourceFile){
      try{
        const r=await fetchWithTimeout(fallbackFile+'?v='+(l.contentHash||Date.now()),{cache:l.contentHash?'default':'no-store'},8500);
        if(r.ok){
          const obj=await r.json();
          if(Array.isArray(obj.items)&&obj.items.length){
            if(db.objectStoreNames.contains('dolItems')) await idbPut('dolItems',{id:l.id, items:obj.items});
            return obj.items;
          }
        }
      }catch(e){ console.warn('dol items fallback fetch',l.id,e); }
    }
  }
  return null;
}
async function dolEnsureBookIndex(bookKey){
  if(DOL_INDEX.loadedBooks.has(bookKey)) return DOL_INDEX.items;
  if(DOL_INDEX.bookPromises.has(bookKey)) return DOL_INDEX.bookPromises.get(bookKey);
  const p=(async()=>{
    const pages=(await dolDisplayStubPages()).filter(l=>dolBookKey(dolCanonicalDolMeta(l))===bookKey);
    const items=[...(DOL_INDEX.items||[])];
    const known=new Set(items.map(w=>w.id));
    for(let i=0;i<pages.length;i++){
      const l=pages[i];
      const lessonItems=await dolLoadLessonItems(l);
      if(!lessonItems) continue;
      for(let itemIndex=0;itemIndex<lessonItems.length;itemIndex++){
        const w=dolExpandItem(l,lessonItems[itemIndex],itemIndex);
        if(w&&!known.has(w.id)){ items.push(w); known.add(w.id); }
      }
      DOL_INDEX.items=items;
      DOL_INDEX.stamp=dolVocabStamp();
      if(i%2===1) await new Promise(r=>setTimeout(r,0));
    }
    DOL_INDEX.items=items;
    DOL_INDEX.loadedBooks.add(bookKey);
    DOL_INDEX.stamp=dolVocabStamp();
    DOL_VOCAB_CACHE={stamp:DOL_INDEX.stamp, items};
    DOL_INDEX.bookPromises.delete(bookKey);
    return items;
  })();
  DOL_INDEX.bookPromises.set(bookKey, p);
  return p;
}
async function dolEnsureIndex(opts={}){
  const stamp=dolVocabStamp();
  if(opts.bookKey) return dolEnsureBookIndex(opts.bookKey);
  const books=dolAllBookKeys();
  if(DOL_INDEX.loadedBooks.size===books.length&&books.length&&DOL_INDEX.stamp===stamp) return DOL_INDEX.items;
  if(DOL_INDEX.building&&DOL_INDEX.promise) return DOL_INDEX.promise;
  DOL_INDEX.building=true;
  DOL_INDEX.promise=(async()=>{
    for(const bk of books){
      await dolEnsureBookIndex(bk);
      await new Promise(r=>setTimeout(r,0));
    }
    DOL_INDEX.building=false;
    return DOL_INDEX.items;
  })();
  try{ return await DOL_INDEX.promise; }
  catch(e){ DOL_INDEX.building=false; throw e; }
  finally{ if(DOL_INDEX.loadedBooks.size===books.length) DOL_INDEX.promise=null; }
}
function dolWarmIndexByBooks(bookKeys){

  if(!books.length) return;
  DOL_INDEX.warming=true;
  (async()=>{
    try{
      for(const bk of books){
        await dolEnsureBookIndex(bk);
        scheduleRenderDol();
        await new Promise(r=>setTimeout(r,10));
      }
    }catch(e){ console.warn('dol warm',e); }
    finally{ DOL_INDEX.warming=false; }
  })();
}

function dolFlatL3HTML(filtered,stubPages){
  const map=new Map();

  const allowed=new Set(filtered.map(w=>{ const u=dolUiMeta(w); return [u.l1,u.l2,u.l3].join('\x1e'); }));
  for(const raw of stubPages){
    const p=dolCanonicalDolMeta(raw), ui=dolUiMeta(p);
    if(DLF.l1&&ui.l1!==DLF.l1) continue;
    if(DLF.l2&&ui.l2!==DLF.l2) continue;
    if(DLF.l3&&ui.l3!==DLF.l3) continue;
    if(DLF.skill&&p.skill!==DLF.skill) continue;
    const key=[ui.l1,ui.l2,ui.l3].join('\x1e');
    if(wordFilterActive&&!allowed.has(key)) continue;
    if(!map.has(key)) map.set(key,{...ui,key,bookKey:dolBookKey(p),pages:[],wordCount:0});
    const row=map.get(key); row.pages.push(p); row.wordCount+=p.wordCount||0;
  }

  const start=DLF.page*10, shown=rows.slice(start,start+10);

    const l4=new Map();
    for(const w of words){ const label=dolUiMeta(w).l4||'Vocabulary'; if(!l4.has(label))l4.set(label,[]); l4.get(label).push(w); }
    const children=indexed?[...l4.entries()].sort((a,b)=>dolNaturalCompare(a[0],b[0])).map(([label,items])=>{
      const first=items[0], lk=dolPassageLazyKey(first.group,first.book,dolItemTestKey(first),first.passageLabel);
      return `<details class="dol-passage"><summary>${dolSumBtnsHTML('dol-passage')}<span class="dol-sum-label">${esc(label)} (${fmtNum(items.length)})</span>${completionButtonHTML(dolVocabCompletionKey(4,first,label))}${dolReadBtnsHTML()}</summary><div class="dol-passage-body dol-passage-lazy" data-dol-lazy="${esc(lk)}" data-dol-count="${items.length}"><p class="note dol-lazy-hint">Open to load ${fmtNum(items.length)} words…</p></div></details>`;
    }).join(''):`<p class="note dol-lazy-hint">Open this L3 item to load its cached L4 and vocabulary data.</p>`;
    const detailId=(row.pages.find(p=>p&&p.id)||{}).id||(words[0]&&words[0].lessonId)||'';
    const detailLink=detailId?`<div class="dol-l3-detail-link"><a href="#/lesson/${encodeURIComponent(detailId)}">📑 Open DOL Vocab Detail</a></div>`:'';
    const l3Completion=completionKey('dol-vocab',3,[row.l1,row.l2,row.l3]);
    return `<details class="dol-test dol-flat-l3${indexed?'':' dol-book-pending'}" data-dol-book="${esc(row.bookKey)}" data-dol-l1="${esc(row.l1)}" data-dol-l2="${esc(row.l2)}" data-dol-l3="${esc(row.l3)}"><summary>${dolSumBtnsHTML('dol-test')}<span class="dol-sum-label"><span class="dol-l2-prefix">L2 · ${esc(row.l2)} ›</span> ${esc(row.l3)}${indexed?'':' <span class="note">⏳</span>'} (${fmtNum(indexed?words.length:row.wordCount)})</span>${completionButtonHTML(l3Completion)}${dolReadBtnsHTML()}</summary>${detailLink}${children}</details>`;
  }).join('');
  return pager+(body||'<div class="empty">No L3 items match the selected filters.</div>')+pager;

const WF={q:'',conf:'',topic:'',source:'all',sourceKind:'',dolGroup:'',dolBook:'',dolTest:'',groupBy:'',seenFilter:'',order:'newest',diff:''};
let VOCAB_CACHE=null;
function vocabStamp(){ return S.lessons.length+':'+(S.lessons.length?S.lessons[S.lessons.length-1].fetchedAt||'':''); }
function collectAllLessonVocab(){
  if(VOCAB_CACHE&&VOCAB_CACHE.stamp===vocabStamp()) return VOCAB_CACHE.items;
  const items=[], seen=new Set(), tmp=document.createElement('div');
  for(const l of S.lessons){
    const newsVocab=buildNewsVocabMap(l);
    const lessonFallback=lessonBandFallback(l);
    for(const sec of l.sections||[]){
      if(!String(sec.id||'').startsWith('vocab')) continue;
      tmp.innerHTML=sec.html||'';
      let curBand=null;
      for(const node of [...tmp.children]){
        if(node.tagName==='H3'||node.tagName==='H4'){
          const p=bandFromHeadingEl(node);
          if(p) curBand=p;
          continue;
        }
        if(!node.matches('.vocab,.vocab-card,.card')) continue;
        const wEl=node.querySelector('.word,.head,.hw,.vocab-word');
        if(!wEl) continue;
        const clone=wEl.cloneNode(true); clone.querySelectorAll('.ipa').forEach(x=>x.remove());
        const word=clone.textContent.replace(/\s+/g,' ').trim().replace(/^\d+\s*[.)·]\s*/,'');
        if(!word) continue;
        const defaultId=l.id+'|'+hashStr(word);
        const flagged=savedWordForLessonText(l.id,word,defaultId);
        const id=flagged?flagged.id:defaultId;
        if(seen.has(id)) continue;
        seen.add(id);
        const vnEl=node.querySelector('.vi,.vn,.vocab-vi-meaning');
        const ipaEl=node.querySelector('.ipa');
        const exFromBlock=vocabExampleFromBlock(node);
        const fromNews=newsVocab.get(normWordKey(word));
        const diff=fromNews||curBand||lessonFallback||null;
        items.push({
          id, lessonId:l.id, text:word,
          vn:(flagged&&flagged.vn)||(vnEl?vnEl.textContent.replace(/\s+/g,' ').trim():''),
          ipa:(flagged&&flagged.ipa)||(ipaEl?ipaEl.textContent.replace(/\s+/g,' ').trim():''),
          confidence:flagged?(flagged.confidence||0):0,
          flagged:!!flagged,
          exEn:(flagged&&flagged.exEn)||(exFromBlock&&exFromBlock.exEn)||'',
          exVi:(flagged&&flagged.exVi)||(exFromBlock&&exFromBlock.exVi)||'',
          addedAt:flagged?flagged.addedAt:(l.dateTime||''),
          diffLabel:diff?diff.label:'', diffKey:diff?diff.key:'', diffFamily:diff?diff.family:''
        });
      }
    }
  }
  tmp.innerHTML='';
  VOCAB_CACHE={stamp:vocabStamp(), items};
  return items;
}
function lessonVocabById(id){ return collectAllLessonVocab().find(v=>v.id===id)||null; }
function dolVocabById(id){ return collectAllDolVocab().find(v=>v.id===id)||null; }

function avgConfList(items){ if(!items.length) return 0; return Math.round(items.reduce((s,i)=>s+(i.confidence||0),0)/items.length); }
function itemFilter(F,items,textOf,isSentence){
  return items.filter(it=>{
    const l=lessonById(it.lessonId);
    if(F.sourceKind&&itemSourceKind(it.lessonId)!==F.sourceKind) return false;
    if(F.dolGroup&&((it.group||(l&&l.group)||'')!==F.dolGroup)) return false;
    if(F.dolBook&&((it.book||(l&&l.book)||'')!==F.dolBook)) return false;
    if(F.dolTest&&dolItemTestKey(Object.assign({},l||{},it))!==F.dolTest) return false;
    if(F.seenFilter){ const seen=cardsViewCount({store:isSentence?'sentences':'words',id:it.id})>0; if(F.seenFilter==='seen'&&!seen)return false; if(F.seenFilter==='unseen'&&seen)return false; }
    if(F.topic){
      if(F.topic.startsWith('sp:')){ if(it.lessonId!==F.topic.slice(3)) return false; }
      else if(!l||String(l.topicNumber)!==F.topic) return false;
    }
    if(F.conf&&!passConfFilter(it.confidence,F.conf)) return false;
    if(F.diff&&!matchesDiffFilter(itemDiffKey(it,isSentence),F.diff)) return false;
    if(F.q&&!textOf(it).toLowerCase().includes(F.q.toLowerCase())) return false;
    return true;
  });
}

function applyReviewGrouping(containerSelector,cardSelector,items,mode){
  if(!mode) return;
  const host=document.querySelector(containerSelector); if(!host) return;
  const cards=[...host.querySelectorAll(cardSelector)]; if(!cards.length) return;
  const groups=new Map();
  cards.forEach((card,i)=>{ const label=reviewGroupLabel(items[i],mode); if(!groups.has(label))groups.set(label,[]); groups.get(label).push(card); });
  const marker=document.createComment('review-groups'); cards[0].parentNode.insertBefore(marker,cards[0]);
  for(const [label,nodes] of groups){
    const d=document.createElement('details'); d.className='panel review-group'; d.open=true; d.dataset.reviewReadScope='1';

function buildSearchIndex(){
  if(SEARCH_IDX&&SEARCH_IDX.stamp===searchStamp()) return SEARCH_IDX.entries;
  const entries=[];
  const scratch=document.createElement('div');
  const toText=html=>{ scratch.innerHTML=html; return (scratch.textContent||'').replace(/\s+/g,' ').trim(); };
  for(const l of S.lessons){
    const sortTime=l.dateTime||'';
    entries.push({kind:'lesson', id:l.id, secId:'', title:l.title, bbc:isBbcLike(l), where:'title / metadata', sortTime,
      text:[l.title,l.titleVi||'',l.fullTitle||'',l.angle||'',l.category||'',(l.words||[]).join(' ')].join(' · ')});
    for(const s of l.sections){
      entries.push({kind:'lesson', id:l.id, secId:s.id, title:l.title, where:s.title, sortTime, text:toText(s.html)});
    }
  }
  for(const it of S.speaking){
    const sortTime=speakingActivityTime(it);

      const parts=[q.question,q.question_vi||''];

      entries.push({kind:'speaking', id:it.id, secId:'q'+i, title:it.topic, where:'Q'+(i+1)+' · '+q.question.slice(0,60), sortTime,

}
const GF={q:'',order:'newest'};
function snippetHTML(text,q,maxSnips){
  const lower=text.toLowerCase(), lq=q.toLowerCase();
  const out=[]; let from=0;
  while(out.length<maxSnips){
    const i=lower.indexOf(lq,from);
    if(i===-1) break;
    const s=Math.max(0,i-55), e=Math.min(text.length,i+lq.length+75);
    let snip=esc((s>0?'…':'')+text.slice(s,e)+(e<text.length?'…':''));
    snip=snip.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),'gi'),m=>'<mark>'+m+'</mark>');
    out.push(snip);
    from=i+lq.length+120;
  }
  return out;
}

  const cloudAt=String(rec.updatedAt||(rec.v&&rec.v.updatedAt)||'');

  const cloudIsNewer=Number.isFinite(cloudMs)&&(!Number.isFinite(localMs)||cloudMs>=localMs);

  const merged=JSON.parse(JSON.stringify(base||{}));

function mergeNavigationPrefs(localNav={},cloudNav={}){

      const entry={x:Math.max(0,Math.round(+value.x||0)),y:Math.max(0,Math.round(+value.y||0)),at:+value.at||0};
      if(value.anchor){entry.anchor=String(value.anchor);entry.anchorKind=value.anchorKind==='id'?'id':'data';entry.anchorOffset=Math.round(+value.anchorOffset||0);}
      if(value.listPageKey){entry.listPageKey=String(value.listPageKey);entry.listPage=Math.max(0,Math.round(+value.listPage||0));}
      if(!routePositions[hash]||entry.at>=(+routePositions[hash].at||0)) routePositions[hash]=entry;
    }
  }
  const menuRoutes={};
  for(const source of [localNav.menuRoutes||{},cloudNav.menuRoutes||{}]){
    for(const [section,value] of Object.entries(source)){
      const incoming=normalizeMenuRouteRecord(value);
      if(!incoming.home&&!incoming.detail) continue;
      if(!menuRoutes[section]) menuRoutes[section]={};
      for(const kind of ['home','detail']){
        const entry=incoming[kind];
        if(entry&&(!menuRoutes[section][kind]||(+entry.at||0)>=(+menuRoutes[section][kind].at||0))) menuRoutes[section][kind]=entry;
      }
    }
  }
  const key=e=>JSON.stringify({hash:e.hash,x:e.x,y:e.y,anchor:e.anchor||'',anchorOffset:e.anchorOffset||0,listPageKey:e.listPageKey||'',listPage:e.listPage||0,listening:e.listening||null});
  const byKey=new Map();
  for(const e of localItems.concat(cloudItems)){
    const k=key(e), cur=byKey.get(k);
    if(!cur||(+e.at||0)>=(+cur.at||0)) byKey.set(k,e);
  }
  let items=[...byKey.values()].sort((a,b)=>(+a.at||0)-(+b.at||0));
  let index=items.length-1;
  if(items.length>APP_NAV_HISTORY_LIMIT){
    const before=Math.min(index,Math.floor(APP_NAV_HISTORY_LIMIT*.7)),start=Math.max(0,Math.min(index-before,items.length-APP_NAV_HISTORY_LIMIT));
    items=items.slice(start,start+APP_NAV_HISTORY_LIMIT); index-=start;
  }
  return {routePositions,menuRoutes,history:{items,index:Math.max(-1,Math.min(items.length-1,index))},updatedAt:new Date().toISOString()};
}

const CARD_SOURCE_OPTS=[
  ['','All sources'],
  ['lesson','📚 AI Topics'],
  ['dol','📖 DOL Vocab'],

  ['news','📰 Daily news'],

function itemSourceKind(lessonId){
  if(!lessonId) return 'other';
  if(String(lessonId).startsWith('sp-')) return 'speaking';
  const l=lessonById(lessonId);
  if(!l) return 'other';
  if(isBbcLike(l)) return 'bbc';
  if(isDolLike(l)) return 'dol';
  if(isLessonLike(l)) return 'lesson';
  const type=(l.type||'').toLowerCase();
  const cat=(l.category||'').toLowerCase();
  if(type==='brief'||cat.includes('morning-brief')) return 'brief';
  if(cat.includes('worldcup')||type.includes('worldcup')) return 'worldcup';
  if(type==='news'||cat.includes('daily-news')) return 'news';
  if(type&&type!=='lesson') return type;
  return 'other';
}

function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function enExampleTargets(word){

function vnExampleTargets(vn){

function exampleTargetRe(target, lang){
  const t=String(target||'').trim();
  if(!t) return null;
  if(lang==='en'){
    const parts=t.split(/\s+/).map(escRe);
    const body=parts.length>1?parts.join('\\s+'):parts[0];
    return new RegExp('\\b'+body+'\\b','gi');
  }
  return new RegExp(escRe(t).replace(/\s+/g,'\\s+'),'gi');

function boldTargetInExample(text, targets, lang){
  text=normalizeExampleText(text);
  if(!text) return '';
  const list=(targets||[]).map(t=>String(t||'').trim()).filter(Boolean);
  if(!list.length) return esc(text);
  const ranges=[];
  for(const target of list){
    const re=exampleTargetRe(target, lang);
    if(!re) continue;
    let m;
    while((m=re.exec(text))){
      ranges.push([m.index, m.index+m[0].length]);
      if(!m[0].length) re.lastIndex++;
    }
  }
  if(!ranges.length) return esc(text);
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged=[];
  for(const r of ranges){
    const last=merged[merged.length-1];
    if(last&&r[0]<=last[1]) last[1]=Math.max(last[1], r[1]);
    else merged.push(r.slice());
  }
  let out='', pos=0;
  for(const [a,b] of merged){
    if(a>pos) out+=esc(text.slice(pos,a));
    out+='<strong>'+esc(text.slice(a,b))+'</strong>';
    pos=b;
  }
  if(pos<text.length) out+=esc(text.slice(pos));
  return out;
}
function normalizeExampleText(text){
  return String(text||'')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/\s+/g,' ')
    .trim();
}
function cardsExampleHtml(exEn, exVi, exIpaUs, exIpaUk, word, vn){
  const en=boldTargetInExample(exEn, enExampleTargets(word), 'en');
  const vi=exVi?boldTargetInExample(exVi, vnExampleTargets(vn), 'vi'):'';
  return {en, ipaUs:exIpaUs||'', ipaUk:exIpaUk||'', vi};
}
function exampleWordTokens(text){
  const re=/[A-Za-z][A-Za-z'-]*/g;
  const out=[];
  let m;
  while((m=re.exec(String(text||'')))) out.push({word:m[0]});
  return out;
}
function exampleTokenMatchesTarget(tokens, i, targets){
  const low=t=>t.toLowerCase();
  for(const raw of targets){
    const parts=raw.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if(!parts.length) continue;
    if(parts.length===1){
      const p=parts[0];
      const w=low(tokens[i].word);
      if(w===p||w===p.replace(/-/g,'')||w.replace(/-/g,'')===p) return true;
      continue;
    }
    if(i+parts.length>tokens.length) continue;
    const slice=tokens.slice(i,i+parts.length).map(t=>low(t.word)).join(' ');
    if(slice===parts.join(' ')||slice===parts.join('-')) return true;
  }
  return false;
}
async function cardsExampleIpa(exEn, word, accent){
  const tokens=exampleWordTokens(exEn);
  if(!tokens.length) return '';
  const targets=enExampleTargets(word);
  const chunks=[];
  for(let i=0;i<tokens.length;i++){
    let ipa=await ipaForWord(tokens[i].word, ipaNorm(accent));
    if(ipa){
      const inner=ipa.replace(/^\/|\/$/g,'');
      const bold=exampleTokenMatchesTarget(tokens,i,targets);
      chunks.push(bold?('<strong>/'+esc(inner)+'/</strong>'):('/'+esc(inner)+'/'));
    }
  }
  return chunks.join(' ')||'';
}
function cardsBodyHtml(it, rec, conf){
  const frontLang=CF.front;
  const ex=it.type==='word'?(CF.examples[it.id]||{}):{};
  const recEx=rec&&wordExampleValid(rec);
  const inlineEx=(it.exEn&&!isSyntheticExample(it.exEn))?{exEn:it.exEn, exVi:it.exVi||'', exIpaUs:it.exIpa||''}:null;
  const example=ex.loading?null:(ex.exEn&&!isSyntheticExample(ex.exEn)?ex:(recEx||inlineEx||{}));
  let html='';

  if(CF.stage===0){
    const peek=CF.peek;
    if(peek==='en'||(!peek&&frontLang==='en')){
      if(it.type==='word'){
        html+=cardsWordMainHtml(it);
        html+=cardsDualIpaHtml(it.en, it.ipa||'');
      }else{
        html+=`<div class="fmain en">${esc(it.en)}</div>`;
        html+=cardsDualSentenceIpaHtml(it.en,true);
        html+=cardsMainSpeakHtml(it,false);
      }
    }else if(peek==='vn'||(!peek&&frontLang==='vn')){
      html+=`<div class="fmain vnt main-meaning">${esc(it.vn||'(no Vietnamese saved)')}</div>`;
      if(it.type!=='word') html+=cardsMainSpeakHtml(it,false);
      else html+=`<div class="fcard-speak" onclick="event.stopPropagation()">${cardsMainSpeakHtml(it,true)}</div>`;
    }
    if(peek&&peek!==frontLang){
      html+=`<div class="fsub note">peek — ${peek==='en'?'English':'Tiếng Việt'} (↑/↓ toggle)</div>`;
    }
  }else{
    if(it.type==='word'){
      html+=cardsWordMainHtml(it);
      html+=cardsDualIpaHtml(it.en, it.ipa||'');
    }else{
      html+=`<div class="fmain en">${esc(it.en)}</div>`;
      html+=cardsDualSentenceIpaHtml(it.en,true);
      html+=cardsMainSpeakHtml(it,false);
    }
    html+=`<div class="fsub vnt main-meaning">${esc(it.vn||'(no Vietnamese saved)')}</div>`;
    if(it.type==='word'){
      html+=`<div class="fex">`;
      if(ex.loading) html+=`<div class="note">Loading example…</div>`;
      else if(example&&example.exEn){
        const exHtml=cardsExampleHtml(example.exEn, example.exVi, example.exIpaUs, example.exIpaUk, it.en, it.vn);
        const exId=it.id.replace(/'/g,"\\'");
        html+=`<div class="en">${exHtml.en} ${dualSoundBtnsHtml('sbtn',acc=>`playCardExample('${exId}','${acc}')`,{stopProp:true,type:'button',title:'Listen ACC'})}</div>`;
        if(ex.ipaLoading) html+=`<div class="ipat note">Loading IPA…</div>`;
        else html+=cardsDualExampleIpaHtml(exHtml.ipaUs, exHtml.ipaUk);
        html+=`<div class="vnt">${exHtml.vi||esc('(translating…)')}</div>`;
      }else html+=`<div class="note">No example available.</div>`;
      html+=`</div>`;
    }
    html+=`<div class="fconf-panel"><span class="lbl">Confidence</span>`;
    html+=confBtnsHTML(conf,`setItemConf('${it.store}','${it.id.replace(/'/g,"\\'")}',LVL)`);
    html+=`</div>`;
  }
  return html;
}
function renderCards(skipDolBootstrap){

      return;
    }
    if(!DOL_INDEX.items.length&&!DOL_CARDS_BOOTING&&!DOL_INDEX.building){
      DOL_CARDS_BOOTING=true;
      dolCardsBootstrap().then(()=>{
        DOL_CARDS_BOOTING=false;
        if(location.hash.startsWith('#/cards')) renderCards(true);
      }).catch(e=>{
        console.warn('cards dol bootstrap',e);
        DOL_CARDS_BOOTING=false;
        if(location.hash.startsWith('#/cards')) renderCards(true);
      });
      if(dolOnly){
        $('#view').innerHTML='<section class="panel"><h2>🃏 Flashcards</h2><p class="dol-loading note">Loading Cam 16–20 DOL cards…</p></section>';
        return;
      }
    }
  }
  cardsEnsureDeck(false);
  const pool=cardsRawItems().length;
  const n=CF.order.length;
  const active=cardsActiveFilters();
  const countLbl=n!==pool?fmtOf(n,pool,'cards'):fmtNum(n)+' card'+(n===1?'':'s');
  const filterLbl=active.length?(' · filtered: '+active.join(', ')):'';
  const it=n?CF.order[Math.min(CF.pos,n-1)]:null;
  const rec=it?(it.store==='words'?S.words:S.sentences).get(it.id):null;
  const conf=rec?(rec.confidence||0):0;
  const idq=it?it.id.replace(/'/g,"\\'"):'';
  if(it) cardsMarkSeen(it);
  const seenLbl=it?cardsSeenLabel(it):'';
  $('#view').innerHTML=`
  <section class="panel">
    <h2>🃏 Flashcards <span class="note">(${countLbl}${filterLbl})</span></h2>
    <div class="filters">
      ${orderSelectHTML('CF',CF.listOrder)}
      ${diffFilterSelectHTML(CF,'CF','cardsReset()')}
      <select onchange="if(this.value!=='dol-words'){CF.dolGroup='';CF.dolBook='';CF.dolTest='';CF.dolPassage='';}CF.deck=this.value;cardsReset()">
        <option value="all-lesson-words" ${CF.deck==='all-lesson-words'?'selected':''}>All lesson words</option>
        <option value="dol-words" ${CF.deck==='dol-words'?'selected':''}>📖 DOL Vocab (deduped)</option>
        <option value="flagged-words" ${CF.deck==='flagged-words'?'selected':''}>⭐ Flagged words only</option>
        <option value="flagged-sentences" ${CF.deck==='flagged-sentences'?'selected':''}>📌 Flagged sentences only</option>
        <option value="flagged-both" ${CF.deck==='flagged-both'?'selected':''}>⭐📌 Flagged words and sentences</option>
        <option value="all-types" ${CF.deck==='all-types'||CF.deck==='both'?'selected':''}>All types</option>
      </select>
      <select onchange="CF.source=this.value;CF.topic='';cardsReset()">
        ${CARD_SOURCE_OPTS.map(([v,lbl])=>`<option value="${v}" ${CF.source===v?'selected':''}>${lbl}</option>`).join('')}
      </select>
      ${(CF.source==='lesson'||CF.source==='speaking')?`<select onchange="CF.topic=this.value;cardsReset()"><option value="">All topics</option>${(CF.source==='speaking'?S.speaking.map(x=>['sp:'+x.id,x.topic]):topicOptions()).map(([v,l])=>`<option value="${esc(v)}" ${CF.topic===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`:''}
      <select onchange="CF.front=this.value;CF.stage=0;CF.peek=null;CF.lastSpoken='';saveUiPrefsSoon();renderCards();cardsMaybeSpeak()">

        return `<button type="button" class="btn small" onclick="event.stopPropagation();cardsJumpToItemByPos(${CF.pos})" title="Open and highlight this ${it.type}">↗ ${esc(src.label)}</button>
          ${sl&&CF.source===''?`<span class="note">${esc(sl)}</span>`:''}`; })()}
    </div>
    <p class="cards-hint">${cardsHint()}</p>`
    :`<div class="empty">${CF.deck==='dol-words'&&!DOL_INDEX.items.length&&!DOL_CARDS_BOOTING?'Cam 16–20 DOL cards not ready yet — wait a moment or load books from Data tab.':CF.deck==='dol-words'&&DOL_CARDS_BOOTING?'Loading Cam 16–20 DOL cards…':'No cards match these filters — try another deck or source, relax confidence/level filters, or switch seen filter.'}</div>
    <p class="cards-hint">${cardsHint()}</p>`}
    ${reviewBottomNavHTML('cards')}
  </section>`;
  cardsMaybeSpeak();
  scheduleIpaLabelRefresh();
}
document.addEventListener('keydown',ev=>{
  if(!location.hash.startsWith('#/cards')) return;
  if(ev.target&&ev.target.closest&&ev.target.closest('input,textarea,select,button')) return;
  if(ev.key==='ArrowRight'){ ev.preventDefault(); cardsMove(1); }
  else if(ev.key==='ArrowLeft'){ ev.preventDefault(); cardsMove(-1); }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); cardsPeek('en'); }
  else if(ev.key==='ArrowDown'){ ev.preventDefault(); cardsPeek('vn'); }
  else if(ev.key==='Enter'||ev.key===' '||ev.key==='Tab'){
    if(cardsHasTextSelection()) return;
    ev.preventDefault(); cardsAdvance();
  }
});

       ${S.reloadReport?'<button type="button" class="btn small" onclick="showReloadReport(S.reloadReport)">View last reload report</button>':''}</p>

    <p>
      <button class="btn" onclick="dolCleanIdbKeepCam16to20()">🧹 Clean DOL data (keep Cam 16–20 only)</button>
      <button class="btn primary" id="dolLoadBtn" onclick="dolLoadNextBooks(5)">📥 Load next 5 DOL books</button>
    </p>

    <h3>☁ S3 — user data sync only</h3>
    <p class="note">Bucket: <code>${esc(S3_BASE)}</code></p>
    <p class="note">S3 stores three independent user files: <code>user-core.json</code> (completion, item confidence, flags, bookmarks and edits),
      <code>user-activity.json</code> (study history), and <code>user-cache.json</code> (translations, examples, filters, expanded state, and page/navigation history).
      Reload merges each file record-by-record; deleting the cache file is safe. <b>Study content</b> is always loaded from the JSON files next to this app, never from S3.</p>
    <p><button class="btn primary" onclick="saveToS3()">☁ Save to S3 now</button> <span class="note" id="lastS3"></span></p>

    <p class="note">Opened directly from disk (file://) and fetch is blocked? Pick the JSON files manually:</p>

       <button class="btn" onclick="importLessonFiles($('#lessonFiles').files)">Load selected lesson files</button></p>

    <h3>Backup / migrate (whole IndexedDB)</h3>
    <p><button class="btn primary" onclick="exportAll()">⬇ Export everything to .json</button></p>
    <p><input type="file" id="backupFile" accept=".json">
       <button class="btn" onclick="importAll(false)">⬆ Import (replace all)</button>
       <button class="btn" onclick="importAll(true)">⬆ Import (merge, keep existing)</button></p>

  ensureDolBookStats().then(()=>{
    const el=$('#dolStatsPanel');
    if(el) el.innerHTML=dolStatsTableHTML(DOL_BOOK_STATS);
  }).catch(()=>{
    const el=$('#dolStatsPanel');
    if(el) el.innerHTML='<p class="note">Could not load dol-book-stats.json</p>';
  });
  updateStorState();
  dolIdbStatsLine().then(t=>{ const el=$('#dolIdbStats'); if(el) el.textContent=t; }).catch(()=>{});
  idbReq(db.transaction('meta').objectStore('meta').get('lastS3Save'))
    .then(v=>{ const el=$('#lastS3'); if(el&&v) el.innerHTML='Last saved: '+agoInfo(v.v); }).catch(()=>{});

async function updateStorState(){
  let txt='IndexedDB: '+(db?'open':'unavailable');
  try{
    if(navigator.storage&&navigator.storage.persisted){
      const p=await navigator.storage.persisted();
      txt+=' · Persistent storage: '+(p?'✅ granted (browser will not evict this data)':'⚠ not granted — data still persists across reloads, but keep regular exports as backup');
    }
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      txt+=' · Used ~'+fmtNum(Math.round((e.usage||0)/1024))+' KB';
    }
  }catch(e){}
  const el=$('#storState'); if(el) el.textContent=txt;
}
async function exportAll(){
  await ensureDb();
  await flushStudy();
  await flushUiPrefs();
  const dump={app:'ielts-hourly-practice-tool',schema:1,exportedAt:new Date().toISOString(),stores:{}};
  for(const st of STORES) dump.stores[st]=await idbAll(st);
  const blob=new Blob([JSON.stringify(dump)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ielts-practice-backup-'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup exported.');
}
async function importAll(merge){
  await ensureDb();
  const f=$('#backupFile').files[0];
  if(!f){ toast('Choose a backup .json file first.'); return; }
  let dump;
  try{ dump=JSON.parse(await f.text()); }catch(e){ toast('Not a valid JSON file.'); return; }
  if(!dump.stores){ toast('Not a backup made by this tool (missing "stores").'); return; }
  if(!merge&&!confirm('Replace ALL current progress with the backup file? This cannot be undone.')) return;
  for(const st of STORES){
    const items=dump.stores[st]||[];
    if(!merge){ await idbClear(st); await idbPutMany(st,items); }
    else{
      const existing=new Set((await idbAll(st)).map(x=>x.id||x.key||x.k));
      await idbPutMany(st,items.filter(x=>!existing.has(x.id||x.key||x.k)));
    }
  }
  await loadState({deferMaintenance:true, skipDol:true, loadLessons:true}); renderHero(); route();
  toast('Import complete ('+(merge?'merge':'replace')+').');
}

/* ================= boot ================= */
(async function(){
  // Persistence permission can remain pending indefinitely in embedded/local
  // browsers. It is optional, so never hold the whole app boot behind it.
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().then(v=>{S.persisted=!!v;}).catch(()=>{}); }catch(e){}
  try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){}
  await ensureDb();
  await probeAppEditedAt();
  loadDolManifestStats().then(()=>renderHero()).catch(()=>{});
  await loadState({deferMaintenance:true, skipDol:true, loadLessons:false});
  updateGlobalToggles();
  renderHero();
  startHeroTick();
  route();
  await loadCachedNonDolLessons();
  // The first route renders before the larger lesson cache is hydrated. Render
  // it once more so direct reloads of list/detail URLs show their real data and
  // can resolve saved history anchors immediately.
  route();
  if(!S.speaking.length) await reloadData(true);
  else setTimeout(()=>deferredLoadMaintenance(), 800);
  appReady=true;
  setReloadUi(false);
  // DOL data is demand-loaded from its filters/tree or the explicit load button.
})().catch(e=>{
  console.error('boot failed',e);
  toast('App failed to start ('+e.message+'). Try refreshing the page.', TOAST_MS*4);
  appReady=true;
  setReloadUi(false);
});
